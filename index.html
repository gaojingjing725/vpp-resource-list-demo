<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 虚拟电厂智慧运营平台</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('vpp-theme') || 'dark';
} catch (e) {}
</script>
<link rel="stylesheet" href="shared-theme.css">
<style>
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  min-width: 320px;
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background:
    radial-gradient(circle at 18% 18%, rgba(0, 212, 255, 0.16), transparent 30%),
    radial-gradient(circle at 82% 22%, rgba(23, 118, 229, 0.18), transparent 34%),
    radial-gradient(circle at 68% 82%, rgba(0, 214, 143, 0.08), transparent 28%),
    linear-gradient(135deg, rgba(23, 118, 229, 0.09), transparent 42%),
    linear-gradient(315deg, rgba(0, 212, 255, 0.04), transparent 34%),
    var(--page-bg);
}

button,
input {
  font: inherit;
}

button {
  border: 0;
}

.login-page {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-8) var(--space-4);
  overflow: hidden;
}

.login-page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(rgba(72, 151, 243, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(72, 151, 243, 0.07) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
}

.login-page::after {
  content: "";
  position: absolute;
  inset: 18% auto auto 50%;
  z-index: -1;
  width: 520px;
  height: 520px;
  pointer-events: none;
  border: 1px solid rgba(72, 151, 243, 0.12);
  border-radius: var(--radius-xl);
  box-shadow: inset 0 0 80px rgba(72, 151, 243, 0.08), 0 0 80px rgba(0, 212, 255, 0.05);
  transform: rotate(45deg);
}

.login-backdrop {
  position: absolute;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.energy-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(72, 151, 243, 0.42), rgba(0, 212, 255, 0.22), transparent);
  transform-origin: left center;
}

.energy-line::after {
  content: "";
  position: absolute;
  top: -3px;
  left: 0;
  width: 7px;
  height: 7px;
  border-radius: var(--radius-full);
  background: var(--cyan-500);
  box-shadow: 0 0 16px rgba(0, 212, 255, 0.8);
  animation: energyTravel 4.8s linear infinite;
}

.energy-line.line-one {
  top: 22%;
  left: 12%;
  width: 28vw;
  transform: rotate(-12deg);
}

.energy-line.line-two {
  right: 10%;
  bottom: 24%;
  width: 30vw;
  transform: rotate(18deg);
}

.energy-line.line-two::after {
  animation-delay: -2.4s;
}

.energy-line.line-three {
  top: 35%;
  right: 6%;
  width: 22vw;
  opacity: 0.62;
  transform: rotate(-24deg);
}

.energy-line.line-four {
  bottom: 36%;
  left: 4%;
  width: 25vw;
  opacity: 0.58;
  transform: rotate(22deg);
}

.energy-line.line-five {
  top: 12%;
  right: 28%;
  width: 16vw;
  opacity: 0.48;
  transform: rotate(14deg);
}

.energy-line.line-six {
  right: 6%;
  bottom: 12%;
  width: 22vw;
  opacity: 0.52;
  transform: rotate(-10deg);
}

.energy-line.line-three::after {
  animation-delay: -1.8s;
  animation-duration: 6.4s;
}

.energy-line.line-four::after {
  animation-delay: -3.2s;
  animation-duration: 6.8s;
}

.energy-line.line-five::after {
  animation-delay: -4.4s;
  animation-duration: 7.2s;
}

.energy-line.line-six::after {
  animation-delay: -5.2s;
  animation-duration: 7.6s;
}

.energy-node {
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid rgba(127, 179, 239, 0.56);
  border-radius: var(--radius-full);
  background: rgba(72, 151, 243, 0.18);
  box-shadow: 0 0 24px rgba(72, 151, 243, 0.34);
  animation: pulseNode 3.2s ease-in-out infinite;
}

.energy-node.node-one {
  top: 19%;
  left: 18%;
}

.energy-node.node-two {
  right: 18%;
  top: 28%;
  animation-delay: 0.4s;
}

.energy-node.node-three {
  right: 24%;
  bottom: 22%;
  animation-delay: 0.8s;
}

.login-shell {
  position: relative;
  z-index: 1;
  width: min(100%, 440px);
  animation: riseIn 520ms ease both;
}

.brand-lockup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
  text-shadow: 0 0 22px rgba(72, 151, 243, 0.28);
}

.brand-mark {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  filter: drop-shadow(0 8px 18px rgba(23, 118, 229, 0.36));
}

.brand-name {
  color: var(--text-primary);
  font-size: 22px;
  font-weight: var(--fw-bold);
  line-height: 30px;
  letter-spacing: 1px;
  white-space: nowrap;
}

.login-card {
  position: relative;
  overflow: hidden;
  padding: var(--space-8);
  background: linear-gradient(145deg, rgba(15, 38, 64, 0.96), rgba(13, 33, 55, 0.96));
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.36), 0 0 0 1px rgba(72, 151, 243, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.login-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  z-index: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--primary-400), var(--cyan-500), transparent);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.42);
}

.login-card::after {
  content: "";
  position: absolute;
  inset: -80px -80px auto auto;
  width: 180px;
  height: 180px;
  z-index: 0;
  border-radius: var(--radius-full);
  background: radial-gradient(circle, rgba(72, 151, 243, 0.18), transparent 68%);
  pointer-events: none;
}

.login-card > * {
  position: relative;
  z-index: 1;
}

:root[data-theme="light"] .login-card {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 253, 0.98));
  box-shadow: 0 24px 64px rgba(23, 43, 67, 0.12), 0 0 0 1px rgba(23, 118, 229, 0.04);
}

.login-heading {
  margin-bottom: var(--space-8);
  text-align: center;
}

.login-title {
  margin: 0;
  color: var(--text-primary);
  font-size: 24px;
  font-weight: var(--fw-semibold);
  line-height: 34px;
}

.login-subtitle {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--text-body-sm);
  font-weight: var(--fw-regular);
  line-height: 22px;
}

.login-form {
  display: grid;
  gap: var(--space-8);
}

.form-row {
  display: grid;
  gap: var(--space-2);
}

.form-label {
  color: var(--text-secondary);
  font-size: var(--text-body-sm);
  font-weight: var(--fw-medium);
  line-height: 22px;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;
  top: 50%;
  left: 14px;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
  transform: translateY(-50%);
  transition: color 150ms ease;
}

.ui-icon {
  display: block;
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
}

.input-wrap:focus-within .input-icon {
  color: var(--primary-400);
}

.form-input {
  width: 100%;
  height: 38px;
  padding: var(--space-3) var(--space-4);
  color: var(--text-primary);
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  outline: 0;
  font-size: var(--text-body-sm);
  font-weight: var(--fw-regular);
  line-height: 22px;
  transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
}

.form-input::placeholder {
  color: var(--text-muted);
}

.form-input:hover {
  border-color: var(--border-hover);
}

.form-input:focus {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px rgba(23, 118, 229, 0.1);
}

.form-input.has-icon {
  padding-left: 40px;
}

.form-input.has-toggle {
  padding-right: 40px;
}

.password-toggle {
  position: absolute;
  top: 50%;
  right: var(--space-2);
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transform: translateY(-50%);
  transition: color 150ms ease, background-color 150ms ease;
}

.password-toggle:hover {
  color: var(--text-secondary);
  background: var(--hover-bg);
}

.password-toggle:focus-visible,
.theme-toggle:focus-visible,
.btn:focus-visible {
  outline: 2px solid var(--primary-400);
  outline-offset: 2px;
}

.form-error {
  min-height: 18px;
  color: var(--red-500);
  font-size: var(--text-caption);
  font-weight: var(--fw-regular);
  line-height: 18px;
}

.form-error:empty {
  display: none;
}

.form-input.is-error {
  border-color: var(--red-500);
  box-shadow: 0 0 0 3px rgba(255, 87, 87, 0.1);
}

.login-actions {
  display: grid;
  gap: var(--space-3);
  margin-top: 0;
}

.btn {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 0 var(--space-4);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: var(--text-body-sm);
  font-weight: var(--fw-medium);
  line-height: 22px;
  transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.btn-md {
  height: 38px;
}

.btn-primary {
  color: #FFFFFF;
  background: linear-gradient(90deg, var(--primary-500), var(--primary-400), var(--cyan-500));
  box-shadow: 0 10px 24px rgba(23, 118, 229, 0.22);
}

.btn-primary:hover {
  box-shadow: 0 14px 30px rgba(23, 118, 229, 0.32), 0 0 18px rgba(0, 212, 255, 0.18);
  transform: translateY(-1px);
}

.btn-primary:active {
  background: var(--primary-600);
  transform: translateY(0);
}

.btn-primary:disabled {
  color: var(--text-disabled);
  background: #1E2D4A;
  cursor: not-allowed;
}

.login-status {
  min-height: 18px;
  color: var(--green-500);
  font-size: var(--text-caption);
  line-height: 18px;
  text-align: center;
}

.login-footer {
  margin-top: var(--space-6);
  color: var(--text-muted);
  font-size: var(--text-caption);
  line-height: 18px;
  text-align: center;
}

.theme-toggle {
  position: fixed;
  top: var(--space-6);
  right: var(--space-6);
  z-index: 2;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
}

.theme-toggle:hover {
  color: var(--primary-400);
  background: var(--hover-bg);
  border-color: var(--border-hover);
}

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulseNode {
  0%,
  100% {
    opacity: 0.45;
    transform: scale(0.92);
  }

  50% {
    opacity: 1;
    transform: scale(1.12);
  }
}

@keyframes energyTravel {
  0% {
    left: 0;
    opacity: 0;
  }

  12% {
    opacity: 1;
  }

  88% {
    opacity: 1;
  }

  100% {
    left: calc(100% - 7px);
    opacity: 0;
  }
}

@media (max-width: 639px) {
  .login-page {
    padding: var(--space-6) var(--space-4);
  }

  .login-card {
    padding: var(--space-6) var(--space-4);
  }

  .brand-name {
    font-size: 20px;
    line-height: 28px;
  }

  .energy-line,
  .energy-node {
    display: none;
  }

  .theme-toggle {
    top: var(--space-4);
    right: var(--space-4);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换页面主题" title="切换页面主题">
  <svg class="ui-icon" aria-hidden="true"><use href="icon/login-icons.svg#sun"></use></svg>
</button>

<main class="login-page">
  <div class="login-backdrop" aria-hidden="true">
    <span class="energy-line line-one"></span>
    <span class="energy-line line-two"></span>
    <span class="energy-line line-three"></span>
    <span class="energy-line line-four"></span>
    <span class="energy-line line-five"></span>
    <span class="energy-line line-six"></span>
    <span class="energy-node node-one"></span>
    <span class="energy-node node-two"></span>
    <span class="energy-node node-three"></span>
  </div>
  <section class="login-shell" aria-labelledby="loginTitle">
    <div class="brand-lockup">
      <img class="brand-mark" src="vpp-logo.svg" width="40" height="40" alt="">
      <span class="brand-name">虚拟电厂智慧运营平台</span>
    </div>

    <div class="login-card">
      <header class="login-heading">
        <h1 class="login-title" id="loginTitle">欢迎登录</h1>
      </header>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-row">
          <label class="form-label" for="account">账号</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="icon/login-icons.svg#user"></use></svg>
            <input class="form-input has-icon" id="account" name="account" type="text" autocomplete="username" placeholder="请输入账号">
          </div>
          <div class="form-error" id="accountError" aria-live="polite"></div>
        </div>

        <div class="form-row">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="icon/login-icons.svg#lock"></use></svg>
            <input class="form-input has-icon has-toggle" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" title="显示密码">
              <svg class="ui-icon" aria-hidden="true"><use href="icon/login-icons.svg#eye"></use></svg>
            </button>
          </div>
          <div class="form-error" id="passwordError" aria-live="polite"></div>
        </div>

        <div class="login-actions">
          <button class="btn btn-primary btn-md" id="loginButton" type="submit">
            <svg class="ui-icon" aria-hidden="true"><use href="icon/login-icons.svg#login"></use></svg>
            <span>登录</span>
          </button>
          <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
        </div>
      </form>
    </div>

  </section>
</main>

<script>
const root = document.documentElement;
const loginForm = document.getElementById('loginForm');
const accountInput = document.getElementById('account');
const passwordInput = document.getElementById('password');
const accountError = document.getElementById('accountError');
const passwordError = document.getElementById('passwordError');
const loginButton = document.getElementById('loginButton');
const loginStatus = document.getElementById('loginStatus');
const passwordToggle = document.getElementById('passwordToggle');
const themeToggle = document.getElementById('themeToggle');

function updateThemeButton() {
  const light = root.dataset.theme === 'light';
  themeToggle.innerHTML = '<svg class="ui-icon" aria-hidden="true"><use href="icon/login-icons.svg#' + (light ? 'moon' : 'sun') + '"></use></svg>';
  themeToggle.setAttribute('aria-label', light ? '切换为深色主题' : '切换为浅色主题');
  themeToggle.title = light ? '切换为深色主题' : '切换为浅色主题';
}

function setFieldError(input, target, message) {
  input.classList.toggle('is-error', Boolean(message));
  input.setAttribute('aria-invalid', String(Boolean(message)));
  target.textContent = message;
}

function validateForm() {
  const account = accountInput.value.trim();
  const password = passwordInput.value;
  let valid = true;

  if (!account) {
    setFieldError(accountInput, accountError, '请输入账号');
    valid = false;
  } else {
    setFieldError(accountInput, accountError, '');
  }

  if (!password) {
    setFieldError(passwordInput, passwordError, '请输入密码');
    valid = false;
  } else {
    setFieldError(passwordInput, passwordError, '');
  }

  return valid;
}

passwordToggle.addEventListener('click', () => {
  const visible = passwordInput.type === 'text';
  passwordInput.type = visible ? 'password' : 'text';
  passwordToggle.innerHTML = '<svg class="ui-icon" aria-hidden="true"><use href="icon/login-icons.svg#' + (visible ? 'eye' : 'eye-slash') + '"></use></svg>';
  passwordToggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
  passwordToggle.title = visible ? '显示密码' : '隐藏密码';
});

loginForm.addEventListener('submit', (event) => {
  event.preventDefault();
  loginStatus.textContent = '';

  if (!validateForm()) {
    return;
  }

  loginButton.disabled = true;
  loginButton.querySelector('span').textContent = '登录中';
  loginStatus.textContent = '登录成功，正在进入工作台';

  window.setTimeout(() => {
    window.location.href = 'optimization-decomposition.html';
  }, 500);
});

[accountInput, passwordInput].forEach((input) => {
  input.addEventListener('input', () => {
    if (input === accountInput && input.value.trim()) {
      setFieldError(accountInput, accountError, '');
    }
    if (input === passwordInput && input.value) {
      setFieldError(passwordInput, passwordError, '');
    }
    loginStatus.textContent = '';
  });
});

themeToggle.addEventListener('click', () => {
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  root.dataset.theme = next;
  try {
    localStorage.setItem('vpp-theme', next);
  } catch (e) {}
  updateThemeButton();
});

updateThemeButton();
accountInput.focus();
</script>
</body>
</html>
