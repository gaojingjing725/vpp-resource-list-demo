box-shadow:0 24px 70px rgba(0,0,0,.18)}.welcome i{font-size:34px;color:var(--primary);margin-bottom:18px}.welcome h1{margin:0 0 12px;font-size:24px}.welcome p{margin:0;color:var(--muted);font-size:14px}.hint{margin-top:26px;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;background:rgba(72,151,243,.1);color:#a9cbf5;font-size:13px}
