<style>
:root{--page-bg:#071526;--card-bg:#0d2137;--border:rgba(127,179,239,.16);--text:#e8f0fc;--muted:#8fa7c2;--primary:#4897f3;font-family:"Microsoft YaHei","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:1180px;color:var(--text);background:radial-gradient(circle at 75% 12%,rgba(23,118,229,.13),transparent 32%),var(--page-bg)}.header{height:56px;display:flex;align-items:center;padding:0 24px;background:rgba(13,33,55,.98);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:8px;padding-right:24px;margin-right:28px;border-right:1px solid var(--border)}.logo{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#061d35,#114480);border:1px solid rgba(23,118,229,.3);color:#b9d9ff}.brand span{font-size:17px;font-weight:700;letter-spacing:1px;white-space:nowrap}.nav{height:100%;display:flex;gap:4px}.item{position:relative;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}.item:hover{color:var(--text);background:rgba(72,151,243,.06)}.item.active{font-weight:600;color:var(--text);background:linear-gradient(rgba(23,118,229,.03),rgba(23,118,229,.24))}.item.active:after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--primary)}.submenu{display:none;position:absolute;left:0;top:52px;z-index:10;min-width:156px;padding:6px;background:#fff;border:1px solid #dce6f2;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.22)}.item:hover .submenu{display:block}.sub{height:34px;display:flex;align-items:center;padding:0 12px;border-radius:4px;color:#52667d;font-weight:500;white-space:nowrap}.sub:hover{color:#1776e5;background:#edf5ff}.content{height:calc(100vh - 56px);display:grid;place-items:center;padding:32px}.welcome{width:min(880px,75vw);padding:56px;text-align:center;border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,rgba(15,38,64,.92),rgba(9,27,47,.92));box-shadow:0 24px 70px rgba(0,0,0,.18)}.welcome i{font-size:34px;color:var(--primary);margin-bottom:18px}.welcome h1{margin:0 0 12px;font-size:24px}.welcome p{margin:0;color:var(--muted);font-size:14px}
</style>
<link rel="stylesheet" href="shared-theme.css"><link rel="stylesheet" href="shared-navigation.css?v=20260827-3"><link rel="stylesheet" href="shared-primary-menu-active.css">
<style>
body{min-width:0;background:var(--page-bg);font-family:var(--font-sans);color:var(--text-primary)}
.content{height:calc(100vh - var(--header-h));display:grid;place-items:center;padding:32px}
.welcome{width:min(880px,75vw);padding:56px;text-align:center;border:1px solid var(--border-default);border-radius:12px;background:linear-gradient(145deg,var(--card-bg-alt),var(--card-bg));box-shadow:0 24px 70px rgba(0,0,0,.18)}
.welcome i{font-size:34px;color:var(--primary-400);margin-bottom:18px}.welcome h1{margin:0 0 12px;color:var(--text-primary);font-size:24px;font-weight:700;line-height:32px}.welcome p{margin:0;color:var(--text-muted);font-size:14px;font-weight:400;line-height:22px}.welcome-link{color:var(--primary-400);text-decoration:none;cursor:pointer}.welcome-link:hover{color:var(--primary-300);text-decoration:underline;text-underline-offset:3px}.welcome-link:focus-visible{outline:2px solid var(--border-active);outline-offset:2px;border-radius:2px}
@media(max-width:767px){.content{padding:16px}.welcome{width:100%;padding:32px 24px}}

lass="fa-solid fa-sun"></i></button><div class="header-avatar-wrapper"><div class="header-avatar">GJ</div><i class="fa-solid fa-chevron-down header-avatar-arrow"></i></div></div></header>
<main class="content"><section class="welcome"><i class="fa-solid fa-chart-line"></i><h1>虚拟电厂智慧运营</h1><p>当前可查看的是<a class="welcome-link" href="resource-list.html">“资源管理”</a> <a class="welcome-link" href="resource-analysis.html">“资源分析”</a> <a class="welcome-link" href="control-command.html">“控制指令下发”</a> <a class="welcome-link" href="optimization-decomposition.html">“优化分解”</a> <a class="welcome-link" href="user-management.html">“用户管理”</a> <a class="welcome-link" href="filter-layout-examples.html">“更多”</a>六个页面</p></section></main>
<script>function updateButtons(){const light=document.documentElement.dataset.theme==='light',side=document.documentElement.dataset.navLayout==='side';themeToggle.innerHTML='<i class="fa-solid fa-'+(light?'moon':'sun')+'"></i>';navLayoutToggle.innerHTML='<i class="fa-solid fa-'+(side?'window-maximize':'table-columns')+'"></i>'}function toggleTheme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='light'?'dark':'light';localStorage.setItem('vpp-theme',root.dataset.theme);updateButtons()}function toggleNavLayout(){const root=document.documentElement;root.dataset.navLayout=root.dataset.navLayout==='side'?'top':'side';localStorage.setItem('vpp-nav-layout',root.dataset.navLayout);updateButtons()}document.documentElement.dataset.theme=localStorage.getItem('vpp-theme')||'dark';document.documentElement.dataset.navLayout=localStorage.getItem('vpp-nav-layout')||'top';updateButtons();</script></body>
