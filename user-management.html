<script>
const orgs=[{name:'虚拟电厂运营中心',count:32,children:[{name:'运营管理部',count:8},{name:'调度控制部',count:12},{name:'资源接入部',count:7},{name:'平台运维部',count:5}]},{name:'华东区域中心',count:18,children:[{name:'上海分公司',count:6},{name:'江苏分公司',count:7},{name:'浙江分公司',count:5}]},{name:'华南区域中心',count:11,children:[{name:'广东分公司',count:7},{name:'福建分公司',count:4}]}];
const users=[['张明远','zhangmy','调度控制部','调度管理员','138****6218','zhangmy@vpp.com','on','2026-08-18 09:32'],['李若溪','lirx','运营管理部','运营专员','136****3085','lirx@vpp.com','on','2026-08-17 14:21'],['陈昊宇','chenhy','资源接入部','资源管理员','139****1756','chenhy@vpp.com','on','2026-08-16 11:08'],['王知夏','wangzx','平台运维部','系统管理员','137****9043','wangzx@vpp.com','on','2026-08-15 16:42'],['赵景川','zhaojc','上海分公司','普通用户','135****4862','zhaojc@vpp.com','off','2026-08-14 10:17'],['周思源','zhousy','江苏分公司','区域管理员','188****5371','zhousy@vpp.com','on','2026-08-13 15:30'],['吴清禾','wuqh','浙江分公司','普通用户','150****2198','wuqh@vpp.com','on','2026-08-12 08:55'],['孙嘉树','sunjs','广东分公司','区域管理员','186****7634','sunjs@vpp.com','off','2026-08-11 13:26'],['郑雨桐','zhengyt','福建分公司','普通用户','189****3527','zhengyt@vpp.com','on','2026-08-10 10:48'],['何沐阳','hemuyang','调度控制部','调度专员','133****8164','hemuyang@vpp.com','on','2026-08-09 09:15']];let selectedOrg='全部组织',status='全部',startDate='',endDate='',pendingStart='',pendingEnd='',calendarMonth=new Date(2026,7,1),currentPage=1,pageSize=10;
function renderTree(filter=''){orgTree.innerHTML='<div class="tree-row leaf '+(selectedOrg==='全部组织'?'active':'')+'" onclick="selectOrg(\'全部组织\')"><i class="fa-solid fa-sitemap folder"></i><span>全部组织</span><span class="tree-count">61</span></div>'+orgs.map((o,i)=>{const kids=o.children.filter(x=>!filter||x.name.includes(filter)),show=!filter||o.name.includes(filter)||kids.length;if(!show)return'';return'<div class="tree-node"><div class="tree-row" onclick="toggleNode(event,this)"><i class="fa-solid fa-chevron-down arrow"></i><i class="fa-regular fa-folder-open folder"></i><span>'+o.name+'</span><span class="tree-count">'+o.count+'</span></div><div class="tree-children">'+kids.map(x=>'<div class="tree-row leaf '+(selectedOrg===x.name?'active':'')+'" onclick="selectOrg(\''+x.name+'\')"><span>'+x.name+'</span><span class="tree-count">'+x.count+'</span></div>').join('')+'</div></div>'}).join('')}
function toggleNode(e,row){if(e.target.closest('.leaf'))return;row.parentElement.classList.toggle('collapsed')}function selectOrg(name){selectedOrg=name;currentPage=1;renderTree(treeSearch.value);renderUsers()}function filterTree(v){renderTree(v.trim())}
function renderUsers(){const name=nameFilter.value.trim(),phone=phoneFilter.value.trim(),start=startDate?new Date(startDate+'T00:00:00'):null,end=endDate?new Date(endDate+'T23:59:59'):null;let data=users.filter(u=>{const created=new Date(u[7].replace(' ','T'));return(selectedOrg==='全部组织'||u[2]===selectedOrg)&&(!name||u[0].includes(name))&&(!phone||u[4].includes(phone))&&(status==='全部'||(status==='启用'?u[6]==='on':u[6]==='off'))&&(!start||created>=start)&&(!end||created<=end)}),totalPages=Math.max(1,Math.ceil(data.length/pageSize));currentPage=Math.min(currentPage,totalPages);const pageData=data.slice((currentPage-1)*pageSize,currentPage*pageSize);userRows.innerHTML=pageData.map((u,index)=>'<tr><td class="fixed-left">U202608'+String((currentPage-1)*pageSize+index+1).padStart(3,'0')+'</td><td class="fixed-name col-last-left-fixed">'+u[0]+'</td><td>'+u[1]+'</td><td>'+u[2]+'</td><td>'+u[4]+'</td><td><button class="status-switch '+u[6]+'" type="button" role="switch" aria-checked="'+(u[6]==='on')+'" onclick="toggleUserStatus(this)"><span></span></button></td><td>'+u[7]+'</td><td class="fixed-right col-first-right-fixed"><span class="link-group"><span class="link">修改</span><span class="link">更多</span></span></td></tr>').join('');totalText.textContent='共 '+data.length+' 条记录';jumpInput.value=currentPage;renderPagination(totalPages)}
function renderPagination(totalPages){let html='<button class="page-btn '+(currentPage===1?'disabled':'')+'" '+(currentPage===1?'disabled':'onclick="goToPage('+(currentPage-1)+')"')+'><i class="fa-solid fa-chevron-left"></i></button>';for(let page=1;page<=totalPages;page++)html+='<button class="page-btn '+(page===currentPage?'active':'')+'" onclick="goToPage('+page+')">'+page+'</button>';html+='<button class="page-btn '+(currentPage===totalPages?'disabled':'')+'" '+(currentPage===totalPages?'disabled':'onclick="goToPage('+(currentPage+1)+')"')+'><i class="fa-solid fa-chevron-right"></i></button>';pageNumbers.innerHTML=html}function goToPage(page){currentPage=page;renderUsers()}function togglePageSize(event){event.stopPropagation();pageSizeSelect.classList.toggle('open')}function changePageSize(event,size){event.stopPropagation();pageSize=size;currentPage=1;pageSizeValue.textContent=size+'条';pageSizeSelect.querySelectorAll('.page-size-option').forEach(option=>option.classList.toggle('active',option.textContent===size+'条'));pageSizeSelect.classList.remove('open');renderUsers()}function handleJump(event){if(event.key!=='Enter')return;const totalPages=Math.max(1,pageNumbers.querySelectorAll('.page-btn').length-2),page=Math.min(totalPages,Math.max(1,Number.parseInt(jumpInput.value,10)||1));goToPage(page)}
function toggleStatus(event){event.stopPropagation();dateRangeSelect.classList.remove('open');statusSelect.classList.toggle('open')}function selectStatus(event,value){event.stopPropagation();status=value;statusFilter.querySelector('span').textContent=value;statusSelect.querySelectorAll('.select-option').forEach(option=>option.classList.toggle('active',option.textContent===value));statusSelect.classList.remove('open')}function padDate(value){return String(value).padStart(2,'0')}function dateKey(date){return date.getFullYear()+'-'+padDate(date.getMonth()+1)+'-'+padDate(date.getDate())}function toggleDateRange(event){event.stopPropagation();statusSelect.classList.remove('open');const opening=!dateRangeSelect.classList.contains('open');dateRangeSelect.classList.toggle('open');if(opening){pendingStart=startDate;pendingEnd=endDate;renderCalendar()}}function shiftCalendar(months){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+months,1);renderCalendar()}function calendarMarkup(month){const week=['日','一','二','三','四','五','六'];let html=week.map(day=>'<span class="calendar-week">'+day+'</span>').join(''),first=new Date(month.getFullYear(),month.getMonth(),1),cursor=new Date(month.getFullYear(),month.getMonth(),1-first.getDay());for(let index=0;index<42;index++){const key=dateKey(cursor),outside=cursor.getMonth()!==month.getMonth(),isStart=key===pendingStart,isEnd=key===pendingEnd,inside=pendingStart&&pendingEnd&&key>pendingStart&&key<pendingEnd;html+='<button type="button" class="calendar-day '+(outside?'outside ':'')+(inside?'in-range ':'')+(isStart?'range-start ':'')+(isEnd?'range-end ':'')+'" onclick="pickRangeDate(\''+key+'\')"><span>'+cursor.getDate()+'</span></button>';cursor.setDate(cursor.getDate()+1)}return html}function renderCalendar(){leftMonthTitle.textContent=calendarMonth.getFullYear()+' 年 '+(calendarMonth.getMonth()+1)+' 月';leftCalendar.innerHTML=calendarMarkup(calendarMonth);rangeHint.textContent=pendingStart?(pendingEnd?pendingStart+' ~ '+pendingEnd:'请选择结束日期'):'请选择开始日期'}function pickRangeDate(key){if(!pendingStart||pendingEnd){pendingStart=key;pendingEnd=''}else if(key<pendingStart){pendingEnd=pendingStart;pendingStart=key}else{pendingEnd=key}renderCalendar();if(pendingEnd){startDate=pendingStart;endDate=pendingEnd;updateDateRangeText();dateRangeSelect.classList.remove('open')}}function updateDateRangeText(){const text=dateRangeFilter.querySelector('.date-range-text'),hasRange=startDate&&endDate;text.textContent=hasRange?startDate+' ~ '+endDate:'开始日期 ~ 结束日期';text.classList.toggle('placeholder',!hasRange)}function clearDateRange(){startDate='';endDate='';pendingStart='';pendingEnd='';updateDateRangeText();dateRangeSelect.classList.remove('open')}function applyFilters(){currentPage=1;renderUsers()}function resetFilters(){nameFilter.value='';phoneFilter.value='';status='全部';statusFilter.querySelector('span').textContent=status;statusSelect.querySelectorAll('.select-option').forEach(option=>option.classList.toggle('active',option.textContent===status));currentPage=1;clearDateRange();selectedOrg='全部组织';renderTree();renderUsers()}function toggleFilter(){const section=document.getElementById('filterCard'),collapsed=section.classList.toggle('is-collapsed'),button=section.querySelector('.filter-toggle');button.setAttribute('aria-expanded',String(!collapsed));button.querySelector('span').textContent=collapsed?'展开':'收起';button.querySelector('i').className='fa-solid fa-chevron-'+(collapsed?'down':'up')}
function toggleUserStatus(button){const enabled=button.classList.toggle('on');button.classList.toggle('off',!enabled);button.setAttribute('aria-checked',String(enabled))}function updateNavButtons(){const light=document.documentElement.dataset.theme==='light',side=document.documentElement.dataset.navLayout==='side',themeLabel=light?'切换为深色主题':'切换为浅色主题',layoutLabel=side?'切换为顶部菜单':'切换为左侧菜单';themeToggle.innerHTML='<i class="fa-solid fa-'+(light?'moon':'sun')+'"></i>';themeToggle.title=themeLabel;themeToggle.setAttribute('aria-label',themeLabel);themeToggle.setAttribute('aria-pressed',String(light));navLayoutToggle.innerHTML='<i class="fa-solid fa-'+(side?'window-maximize':'table-columns')+'"></i>';navLayoutToggle.title=layoutLabel;navLayoutToggle.setAttribute('aria-label',layoutLabel);navLayoutToggle.setAttribute('aria-pressed',String(side))}function toggleTheme(){const root=document.documentElement,next=root.dataset.theme==='light'?'dark':'light';root.dataset.theme=next;localStorage.setItem('vpp-theme',next);updateNavButtons()}function toggleNavLayout(){const root=document.documentElement,next=root.dataset.navLayout==='side'?'top':'side';root.dataset.navLayout=next;localStorage.setItem('vpp-nav-layout',next);updateNavButtons()}
function toggleAvatar(event){event.stopPropagation();avatarBtn.classList.toggle('open');avatarPanel.classList.toggle('show')}document.addEventListener('click',()=>{avatarBtn.classList.remove('open');avatarPanel.classList.remove('show');statusSelect.classList.remove('open');dateRangeSelect.classList.remove('open');pageSizeSelect.classList.remove('open')});
document.documentElement.dataset.theme=localStorage.getItem('vpp-theme')||'dark';document.documentElement.dataset.navLayout=localStorage.getItem('vpp-nav-layout')||'top';renderTree();renderUsers();updateNavButtons();
