.operator-form{max-height:480px;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow-y:auto;flex-shrink:0}.operator-field.full{grid-column:1/-1}.operator-field label{display:block;margin-bottom:6px;color:var(--text-secondary);font-size:14px;line-height:22px}.operator-field input{width:100%;height:38px;padding:0 16px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:transparent;color:var(--text-primary);font:400 14px/22px var(--font-sans);outline:0}.operator-field input::placeholder{color:var(--text-muted)}.operator-field input:focus{border-color:var(--border-active);box-shadow:0 0 0 3px rgba(23,118,229,.10)}
.operator-modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--border-divider);flex-shrink:0}

.delete-message{margin:0;color:var(--text-secondary);line-height:22px}.delete-message strong{color:var(--text-primary);font-weight:500}.delete-warning{margin:12px 0 0;color:var(--red-500);font-size:14px;line-height:22px}

@media(max-width:767px){.operator-form{grid-template-columns:1fr;padding:16px}.operator-field.full{grid-column:auto}.operator-modal-mask{padding:16px}.operator-modal-header{padding:12px 16px}.operator-modal-body{padding:16px}.operator-modal-footer{padding:12px 16px}.operator-page .pagination{align-items:flex-start;flex-direction:column}.operator-page .pagination-right{width:100%;justify-content:space-between}}

<script>
const operators = [

  {id:4,name:'浙江清洁能源运营有限公司',level:'省级',users:74,resources:142,capacity:10960,adjustable:5860,region:'浙江省',contact:'王敏',phone:'137****4432',updated:'2026-09-19 09:25'},
  {id:5,name:'安徽省综合能源服务有限公司',level:'省级',users:62,resources:118,capacity:8640,adjustable:4620,region:'安徽省',contact:'赵磊',phone:'135****7815',updated:'2026-09-18 14:05'},

];
let filteredOperators = operators.slice(), selectedIds = new Set(), currentPage = 1, pageSize = 10, editingId = null, toastTimer, lastModalTrigger = null, sortState = { key: null, dir: null };
const $ = id => document.getElementById(id);
function escapeHtml(value){return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function toggleFilter(){const collapsed=$('filterCard').classList.toggle('is-collapsed');const button=$('filterCard').querySelector('.filter-toggle');button.setAttribute('aria-expanded',String(!collapsed));button.querySelector('span').textContent=collapsed?'展开':'收起';button.querySelector('i').className='fa-solid fa-chevron-'+(collapsed?'down':'up')}
function applyFilters(){const keyword=$('operatorSearch').value.trim();filteredOperators=operators.filter(row=>!keyword||row.name.includes(keyword));sortOperators();currentPage=1;renderTable()}
function resetFilters(){$('operatorSearch').value='';applyFilters()}
function sortOperators(){if(!sortState.key)return;const direction=sortState.dir==='asc'?1:-1;filteredOperators.sort((a,b)=>String(a[sortState.key]).localeCompare(String(b[sortState.key]))*direction)}
function toggleSort(key,thEl){if(sortState.key===key){if(sortState.dir==='asc')sortState.dir='desc';else if(sortState.dir==='desc'){sortState.key=null;sortState.dir=null}}else{sortState.key=key;sortState.dir='asc'}document.querySelectorAll('th.sortable').forEach(th=>{th.classList.remove('asc','desc');th.removeAttribute('aria-sort');const icon=th.querySelector('.sort-icon');if(th===thEl&&sortState.dir){th.classList.add(sortState.dir);th.setAttribute('aria-sort',sortState.dir==='asc'?'ascending':'descending');icon.className=`fa-solid fa-sort-${sortState.dir==='asc'?'up':'down'} sort-icon`}else if(icon)icon.className='fa-solid fa-sort sort-icon'});if(!sortState.key){applyFilters();return}sortOperators();currentPage=1;renderTable()}
function toggleSelectAll(){const pageRows=pageData();const all=pageRows.length&&pageRows.every(row=>selectedIds.has(row.id));pageRows.forEach(row=>all?selectedIds.delete(row.id):selectedIds.add(row.id));renderTable()}
function toggleRow(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);renderTable()}
function pageData(){const start=(currentPage-1)*pageSize;return filteredOperators.slice(start,start+pageSize)}
function renderTable(){const total=Math.max(1,Math.ceil(filteredOperators.length/pageSize));if(currentPage>total)currentPage=total;const rows=pageData();$('operatorRows').innerHTML=rows.length?rows.map(row=>`<tr class="${selectedIds.has(row.id)?'selected':''}"><td class="col-fixed-left col-fixed-checkbox"><div class="checkbox ${selectedIds.has(row.id)?'checked':''}" role="checkbox" tabindex="0" aria-checked="${selectedIds.has(row.id)}" aria-label="选择 ${escapeHtml(row.name)}" onclick="toggleRow(${row.id})" onkeydown="checkboxKeydown(event,()=>toggleRow(${row.id}))"></div></td><td class="col-fixed-left col-fixed-name col-last-left-fixed" title="${escapeHtml(row.name)}"><span class="operator-name">${escapeHtml(row.name)}</span></td><td>${escapeHtml(row.level)}</td><td class="num">${row.users}</td><td class="num">${row.resources}</td><td class="num">${row.capacity.toLocaleString('zh-CN')}</td><td class="num">${row.adjustable.toLocaleString('zh-CN')}</td><td>${escapeHtml(row.region)}</td><td class="contact" title="${escapeHtml(row.contact)}">${escapeHtml(row.contact)}</td><td>${escapeHtml(row.phone)}</td><td class="date">${escapeHtml(row.updated)}</td><td class="col-fixed-right col-first-right-fixed"><button class="action-link" type="button" onclick="openOperatorModal(${row.id})">编辑</button></td></tr>`).join(''):`<tr><td class="operator-empty" colspan="12">暂无匹配的运营商数据</td></tr>`;$('totalRecords').textContent=`共 ${filteredOperators.length} 条记录`;$('jumpInput').value=currentPage;updateSelectionState();renderPages()}
function updateSelectionState(){const rows=pageData();const all=rows.length&&rows.every(row=>selectedIds.has(row.id));const some=rows.some(row=>selectedIds.has(row.id));$('headerCheckbox').classList.toggle('checked',all);$('headerCheckbox').classList.toggle('indeterminate',!all&&some);$('headerCheckbox').setAttribute('aria-checked',all?'true':some?'mixed':'false');$('deleteButton').disabled=selectedIds.size===0}
function renderPages(){const total=Math.max(1,Math.ceil(filteredOperators.length/pageSize));if(currentPage>total)currentPage=total;const items=[`<button class="page-btn ${currentPage===1?'disabled':''}" type="button" ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})" aria-label="上一页"><i class="fa-solid fa-chevron-left"></i></button>`];for(let page=1;page<=total;page++){if(total>7&&page>3&&page<total-1&&Math.abs(page-currentPage)>1){if(items[items.length-1]!=='<span class="page-ellipsis">...</span>')items.push('<span class="page-ellipsis">...</span>');continue}items.push(`<button class="page-btn ${page===currentPage?'active':''}" type="button" onclick="goToPage(${page})" aria-current="${page===currentPage?'page':'false'}">${page}</button>`)}items.push(`<button class="page-btn ${currentPage===total?'disabled':''}" type="button" ${currentPage===total?'disabled':''} onclick="goToPage(${currentPage+1})" aria-label="下一页"><i class="fa-solid fa-chevron-right"></i></button>`);$('pageNumbers').innerHTML=items.join('')}
function goToPage(page){const total=Math.max(1,Math.ceil(filteredOperators.length/pageSize));currentPage=Math.max(1,Math.min(total,page));renderTable()}
function togglePageSize(event){event.stopPropagation();document.querySelector('.page-size-select').classList.toggle('open')}
function changePageSize(size){pageSize=size;currentPage=1;$('pageSizeValue').textContent=size+'条';document.querySelectorAll('.page-size-option').forEach(item=>item.classList.toggle('active',item.textContent===size+'条'));document.querySelector('.page-size-select').classList.remove('open');renderTable()}
function handleJump(event){if(event.key==='Enter'){const target=Number.parseInt(event.target.value,10);if(Number.isInteger(target))goToPage(target);else event.target.value=currentPage}}
function openOperatorModal(id){lastModalTrigger=document.activeElement;editingId=id||null;const row=operators.find(item=>item.id===id);$('operatorModalTitle').textContent=row?'编辑运营商':'新增运营商';$('formName').value=row?.name||'';$('formLevel').value=row?.level||'';$('formRegion').value=row?.region||'';$('formContact').value=row?.contact||'';$('formPhone').value=row?.phone||'';$('operatorModalMask').classList.add('open');$('formName').focus()}
function closeOperatorModal(){ $('operatorModalMask').classList.remove('open'); if(lastModalTrigger?.isConnected){lastModalTrigger.focus();lastModalTrigger=null} }
function saveOperator(){const name=$('formName').value.trim();if(!name){showToast('请输入运营商名称');$('formName').focus();return}const payload={name,level:$('formLevel').value.trim()||'省级',region:$('formRegion').value.trim()||'-',contact:$('formContact').value.trim()||'-',phone:$('formPhone').value.trim()||'-',users:0,resources:0,capacity:0,adjustable:0,updated:new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-')};if(editingId)Object.assign(operators.find(item=>item.id===editingId),payload);else operators.unshift({id:Date.now(),...payload});closeOperatorModal();applyFilters();showToast(editingId?'运营商信息已更新':'运营商已新增')}
function deleteSelected(){if(!selectedIds.size)return;lastModalTrigger=document.activeElement;$('deleteMessage').innerHTML=`将删除已选择的 <strong>${selectedIds.size}</strong> 个运营商。`;$('deleteModalMask').classList.add('open');$('deleteModalMask').querySelector('.modal-close').focus()}
function closeDeleteModal(){ $('deleteModalMask').classList.remove('open'); if(lastModalTrigger?.isConnected){lastModalTrigger.focus();lastModalTrigger=null} }
function confirmDelete(){for(let index=operators.length-1;index>=0;index--)if(selectedIds.has(operators[index].id))operators.splice(index,1);selectedIds.clear();closeDeleteModal();applyFilters();showToast('已删除选中的运营商')}
function exportOperators(){const header=['运营商名称','层级','用户数量（个）','资源数量（个）','聚合容量（kW）','可调容量（kW）','所属区域','常用联系人','联系方式','更新时间'];const csv=[header,...filteredOperators.map(row=>[row.name,row.level,row.users,row.resources,row.capacity,row.adjustable,row.region,row.contact,row.phone,row.updated])].map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(',')).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));link.download='运营商管理.csv';link.click();URL.revokeObjectURL(link.href);showToast('运营商数据已导出')}
function downloadTemplate(){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['运营商名称,层级,所属区域,常用联系人,联系方式\n'],{type:'text/csv;charset=utf-8'}));link.download='运营商导入模板.csv';link.click();URL.revokeObjectURL(link.href);showToast('导入模板已下载')}
$('importInput').addEventListener('change',event=>{if(event.target.files[0])showToast(`已选择导入文件：${event.target.files[0].name}`);event.target.value=''})
document.addEventListener('click',event=>{if(!event.target.closest('.page-size-select'))document.querySelector('.page-size-select').classList.remove('open')});
function checkboxKeydown(event,action){if(event.key==='Enter'||event.key===' '){event.preventDefault();action()}}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeOperatorModal();closeDeleteModal()}});
renderTable();
</script>
</body>
</html>
