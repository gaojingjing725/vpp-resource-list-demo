/* Compact filters share the table heading row. */
.list-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;min-height:38px}
.list-heading h1{flex:none}
.list-heading .filter-grid{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0}

.list-heading .actions{flex:none}

.field-clear{position:absolute;right:32px;top:7px;width:24px;height:24px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:transparent;z-index:2}
.field-clear svg{width:16px;height:16px;background:#edf1f6;border-radius:50%}
.field-clear:hover{color:var(--secondary);background:#e7eef7}
#clearKeyword{right:7px}
#keyword{padding-right:36px}
.field.has-value summary.control{padding-right:58px;position:relative}
.field.has-value summary.control>svg:last-child{position:absolute;right:12px;top:12px}
#dateValue,#statusValue{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Keep related metadata together above the timeline. */
.timeline-body .metadata{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;width:fit-content;max-width:100%;margin:0 auto;gap:10px 36px;padding:10px 16px;background:var(--page);border-radius:6px}

.timeline-body .metadata span{display:inline;margin-right:8px;color:var(--muted);font-size:12px}
.timeline-body .steps-wrap{padding-top:20px}
@media(max-width:1000px){.timeline-body .metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:10px 20px}}
@media(max-width:600px){.timeline-body .metadata{grid-template-columns:minmax(0,1fr);gap:8px}.timeline-body .metadata span{display:inline-block;min-width:72px}}

<script>
(function () {
  const items = [
    '运营商管理',
    '客户管理',
    '设备管理',
    '聚合单元管理',
    '合同管理',
    { label: '量测管理', children: ['模拟量管理', '状态量管理', '控制参数管理', '电度参数管理'] },
    { label: '量测配置', children: ['资源类型', '量测类型', '数据类型', '设备类型', '电压等级类型', '行业管理'] }
  ];
  const activeSecondary = document.body.dataset.activeBasicSecondary || '';
  const routes = { 运营商管理: 'operator-management.html', 客户管理: 'customer-management.html', 聚合单元管理: 'aggregation-unit-management.html' };

  document.querySelectorAll('.header-nav-item').forEach(item => {
    const label = Array.from(item.childNodes).find(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
    if (!label || label.textContent.trim() !== '基础管理' || item.querySelector('.header-submenu')) return;

    item.classList.add('header-nav-dropdown', 'nav-dropdown');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-expanded', 'false');

    const submenu = document.createElement('div');
    submenu.className = 'header-submenu nav-submenu';
    items.forEach(entry => {
      const name = typeof entry === 'string' ? entry : entry.label;
      const option = document.createElement('div');
      option.className = 'header-submenu-item nav-subitem';
      option.setAttribute('role', 'menuitem');
      option.setAttribute('tabindex', '-1');
      option.textContent = name;
      if (name === activeSecondary) option.classList.add('active');
      if (routes[name]) {
        option.setAttribute('role', 'link');
        option.setAttribute('tabindex', '0');
        option.addEventListener('click', event => {
          event.stopPropagation();
          window.location.href = routes[name];
        });
        option.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          event.stopPropagation();
          window.location.href = routes[name];
        });
      }
      if (typeof entry !== 'string') {
        option.classList.add('has-submenu');
        option.setAttribute('aria-haspopup', 'true');
        option.setAttribute('aria-expanded', 'false');
        const nestedMenu = document.createElement('div');
        nestedMenu.className = 'header-submenu nav-submenu nested-submenu';
        entry.children.forEach(childName => {
          const child = document.createElement('div');
          child.className = 'header-submenu-item nav-subitem';
          child.setAttribute('role', 'menuitem');
          child.setAttribute('tabindex', '-1');
          child.textContent = childName;
          nestedMenu.appendChild(child);
        });
        option.appendChild(nestedMenu);
        option.addEventListener('mouseenter', () => option.setAttribute('aria-expanded', 'true'));
        option.addEventListener('mouseleave', () => option.setAttribute('aria-expanded', 'false'));
        option.addEventListener('focusin', () => option.setAttribute('aria-expanded', 'true'));
        option.addEventListener('focusout', event => {
          if (!option.contains(event.relatedTarget)) option.setAttribute('aria-expanded', 'false');
        });
      }
      submenu.appendChild(option);
    });
    item.appendChild(submenu);
    item.addEventListener('focusin', () => item.setAttribute('aria-expanded', 'true'));
    item.addEventListener('focusout', event => {
      if (!item.contains(event.relatedTarget)) item.setAttribute('aria-expanded', 'false');
    });
    item.addEventListener('mouseenter', () => item.setAttribute('aria-expanded', 'true'));
    item.addEventListener('mouseleave', () => item.setAttribute('aria-expanded', 'false'));
  });

  document.addEventListener('click', event => {
    if (event.target.closest('.header-submenu-item')) return;
    document.querySelectorAll('.header-nav-dropdown.open, .nav-dropdown.open').forEach(item => {
      item.classList.remove('open');
      item.setAttribute('aria-expanded', 'false');
    });
  });
})();

(function () {
  if (!document.body) return;

  const tooltipId = 'shared-table-tooltip';
  const tooltip = document.getElementById(tooltipId) || document.createElement('div');
  if (!tooltip.id) {
    tooltip.id = tooltipId;
    tooltip.className = 'table-tooltip';
    tooltip.setAttribute('role', 'tooltip');
    tooltip.hidden = true;
    document.body.appendChild(tooltip);
  }

  let activeTarget = null;
  let activeCell = null;

  function isTableCell(cell) {
    return cell && cell.matches('td') && cell.closest('.table-card, .table-container');
  }

  function isExcludedCell(cell) {
    return cell.matches('.col-fixed-right, .col-fixed-ops, .empty-cell, .operator-empty, .customer-empty')
      || cell.querySelector('.action-link, .action-links, .action-separator, .checkbox, .status-switch, .link-group');
  }

  function getMeasureTarget(cell) {
    return cell.querySelector('.cell-text, .td-text-ellipsis') || cell;
  }

  function getCellText(cell, measureTarget) {
    const title = cell.getAttribute('title');
    const text = title || measureTarget.textContent || '';
    return text.trim();
  }

  function isTruncated(cell, measureTarget) {
    return [measureTarget, cell].some(element => element.clientWidth > 0 && element.scrollWidth > element.clientWidth + 1);
  }

  function prepareCell(cell) {
    if (!isTableCell(cell) || isExcludedCell(cell)) return;
    const measureTarget = getMeasureTarget(cell);
    const text = getCellText(cell, measureTarget);
    if (!text) return;

    cell.dataset.tableTooltipText = text;
    cell.removeAttribute('title');
    measureTarget.removeAttribute('title');

    if (isTruncated(cell, measureTarget)) {
      const focusTarget = measureTarget;
      if (!focusTarget.hasAttribute('tabindex')) {
        focusTarget.setAttribute('tabindex', '0');
        focusTarget.dataset.tableTooltipTabindex = 'added';
      }
    } else if (measureTarget.dataset.tableTooltipTabindex === 'added') {
      measureTarget.removeAttribute('tabindex');
      delete measureTarget.dataset.tableTooltipTabindex;
    }
  }

  function refreshCells() {
    document.querySelectorAll('.table-card td, .table-container td').forEach(prepareCell);
  }

  function resolveTarget(cell) {
    if (!isTableCell(cell) || isExcludedCell(cell)) return null;
    const measureTarget = getMeasureTarget(cell);
    const text = cell.dataset.tableTooltipText || getCellText(cell, measureTarget);
    if (!text || !isTruncated(cell, measureTarget)) return null;
    return { cell, target: measureTarget, text };
  }

  function positionTooltip(target) {
    const targetRect = target.getBoundingClientRect();
    const tooltipRect = tooltip.getBoundingClientRect();
    const gap = 8;
    let left = targetRect.left;
    let top = targetRect.top - tooltipRect.height - gap;
    const below = top < 8;
    if (below) top = targetRect.bottom + gap;
    tooltip.classList.toggle('below', below);
    left = Math.max(8, Math.min(left, window.innerWidth - tooltipRect.width - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - tooltipRect.height - 8));
    const arrowLeft = Math.max(14, Math.min(targetRect.left + targetRect.width / 2 - left - 4, tooltipRect.width - 14));
    tooltip.style.setProperty('--tooltip-arrow-left', `${arrowLeft}px`);
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function hideTooltip() {
    if (!activeTarget) return;
    if (activeTarget.dataset.tableTooltipAria === '') activeTarget.removeAttribute('aria-describedby');
    else if (activeTarget.dataset.tableTooltipAria) activeTarget.setAttribute('aria-describedby', activeTarget.dataset.tableTooltipAria);
    delete activeTarget.dataset.tableTooltipAria;
    activeTarget = null;
    activeCell = null;
    tooltip.classList.remove('show');
    tooltip.hidden = true;
  }

  function showTooltip(info) {
    if (activeTarget !== info.target) hideTooltip();
    activeTarget = info.target;
    activeCell = info.cell;
    if (!Object.prototype.hasOwnProperty.call(activeTarget.dataset, 'tableTooltipAria')) {
      activeTarget.dataset.tableTooltipAria = activeTarget.getAttribute('aria-describedby') || '';
    }
    tooltip.textContent = info.text;
    tooltip.hidden = false;
    tooltip.classList.add('show');
    activeTarget.setAttribute('aria-describedby', tooltipId);
    positionTooltip(activeTarget);
  }

  function cellFromEvent(event) {
    return event.target instanceof Element ? event.target.closest('td') : null;
  }

  document.addEventListener('pointerover', event => {
    const cell = cellFromEvent(event);
    if (!cell || (event.relatedTarget instanceof Node && cell.contains(event.relatedTarget))) return;
    const info = resolveTarget(cell);
    if (info) showTooltip(info);
    else if (activeCell === cell) hideTooltip();
  });

  document.addEventListener('pointerout', event => {
    const cell = cellFromEvent(event);
    if (cell && activeCell === cell && !(event.relatedTarget instanceof Node && cell.contains(event.relatedTarget))) hideTooltip();
  });

  document.addEventListener('focusin', event => {
    const cell = cellFromEvent(event);
    const info = resolveTarget(cell);
    if (info) showTooltip(info);
  });

  document.addEventListener('focusout', event => {
    const cell = cellFromEvent(event);
    if (cell && activeCell === cell && !(event.relatedTarget instanceof Node && cell.contains(event.relatedTarget))) hideTooltip();
  });

  window.addEventListener('resize', () => {
    refreshCells();
    if (activeTarget) positionTooltip(activeTarget);
  });
  document.addEventListener('scroll', () => { if (activeTarget) positionTooltip(activeTarget); }, true);

  let refreshQueued = false;
  const queueRefresh = () => {
    if (refreshQueued) return;
    refreshQueued = true;
    requestAnimationFrame(() => {
      refreshQueued = false;
      refreshCells();
    });
  };
  new MutationObserver(queueRefresh).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['title', 'class', 'style'] });
  queueRefresh();
})();

</script>

  document.getElementById('avatarBtn').classList.remove('open');
  document.getElementById('avatarPanel').classList.remove('show');
});
</script>
<main class="main"><div class="breadcrumb"><div class="breadcrumb-list"><span class="breadcrumb-item" onclick="location.href='index.html'"><i class="fa-solid fa-house"></i></span><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span class="breadcrumb-item">交易管理</span><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span class="breadcrumb-item current">交易总览</span></div></div>
<div class="stack">
<section class="metrics" aria-label="交易统计"><div class="metric"><div><div class="metric-label">交易总数</div><div class="metric-value">24<span class="unit">笔</span></div></div><div class="metric-icon"><svg><use href="#i-document"/></svg></div></div><div class="metric"><div><div class="metric-label">累计次数</div><div class="metric-value">24<span class="unit">次</span></div></div><div class="metric-icon"><svg><use href="#i-clock"/></svg></div></div><div class="metric"><div><div class="metric-label">累计电量</div><div class="metric-value">25.00<span class="unit">kWh</span></div></div><div class="metric-icon"><svg><use href="#i-bolt"/></svg></div></div><div class="metric"><div><div class="metric-label">累计收益</div><div class="metric-value">1,250.00<span class="unit">元</span></div></div><div class="metric-icon"><svg><use href="#i-money"/></svg></div></div></section>
<section class="status-summary" id="statusSummary" aria-label="各交易状态数量"></section>
<section class="list-area" aria-label="交易列表与筛选">
<div class="list-heading"><h1>交易列表</h1>
<form id="filtersForm" class="filter-grid"><div class="field"><input aria-label="关键词" class="control" id="keyword" placeholder="搜索交易名称或序列号" autocomplete="off"><svg class="input-icon"><use href="#i-search"/></svg><button type="button" class="field-clear" id="clearKeyword" aria-label="清除关键词" title="清除关键词" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6m0-6-6 6"/></svg></button></div>
<div class="field"><details class="dropdown" id="statusDropdown"><summary class="control" aria-label="交易状态"><span id="statusValue">全部状态</span><svg><use href="#i-down"/></svg></summary><div class="popover" id="statusOptions"></div></details><button type="button" class="field-clear" id="clearStatus" aria-label="清除状态" title="清除状态" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6m0-6-6 6"/></svg></button></div>
<div class="field"><details class="dropdown" id="dateDropdown"><summary class="control date-summary" aria-label="执行日期"><svg style="color:var(--muted)"><use href="#i-calendar"/></svg><span id="dateValue">请选择执行日期</span><svg><use href="#i-down"/></svg></summary><div class="popover calendar"><div class="calendar-head"><button type="button" class="page-btn" id="prevMonth" aria-label="上个月"><svg><use href="#i-left"/></svg></button><span id="monthLabel"></span><button type="button" class="page-btn" id="nextMonth" aria-label="下个月"><svg><use href="#i-right"/></svg></button></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-foot"><button class="link" type="button" id="clearDate">清空日期</button></div></div></details><button type="button" class="field-clear" id="clearDateField" aria-label="清除执行日期" title="清除执行日期" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6m0-6-6 6"/></svg></button></div>
<div class="actions"><button class="btn ghost" type="reset"><svg><use href="#i-reset"/></svg>重置</button></div></form></div>

<div class="table-card"><div class="table-scroll" id="tableScroll"><table aria-label="交易列表"><colgroup><col style="width:64px"><col style="width:19%"><col style="width:21%"><col style="width:14%"><col style="width:24%"><col style="width:110px"><col style="width:110px"></colgroup><thead><tr><th><span style="font-size:12px;color:var(--muted)">选择</span></th><th>交易序列号</th><th>交易名称</th><th>交易品种</th><th>执行时段</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="recordCount"></span><div class="pager" id="pager"></div></div></div>
</section>
<section class="timeline-card" id="timelineCard" aria-labelledby="timelineTitle"><div class="timeline-heading"><h2 id="timelineTitle">交易状态时间线<span class="trade-name" id="tradeName"></span></h2><div id="currentStatus"></div></div><div id="timelineBody" aria-live="polite"></div></section>
</div><div class="note">示例数据 · 用于排版与联动交互预览</div></main>
<script>
const stages=['草稿','待下发','申报中','申报截止','待出清','已出清','执行中','待结算','已结算'];
const records=Array.from({length:24},(_,i)=>({id:i===0?'20261026001':`DRAFT-202610${String(27-i).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,name:i===0?'测试交易-wx':i===1?'测试交易101901':`交易信息草稿${i+1}`,type:['需求响应','需求响应','市场化响应','辅助备用','辅助调频','辅助调峰'][i%6],date:i===0?'2026-10-27':`2026-10-${String(28-i).padStart(2,'0')}`,time:i===0?'00:00–01:30':['15:30–16:00','04:30–05:00','09:00–09:30','03:30–04:00'][i%4],stage:i<16?7:i<20?0:i<23?1:8}));
// Preview timestamps belong to each record, rather than the selection time.
records.forEach((record,index)=>{record.updatedAt=record.date+' '+(index===0?'01:30:00':record.time.split('–')[1]+':00')});
const $=id=>document.getElementById(id);const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let visible=records.slice(),selected=records[0].id,page=1,pendingStatus='',pendingDate='',month=9,year=2026;const size=10;
const palette=index=>index===8?['#00d68f','rgba(0,214,143,.10)']:index===7?['#ffb547','rgba(255,181,71,.12)']:index===0?['#4a5670','rgba(74,86,112,.08)']:['#1776e5','rgba(23,118,229,.08)'];
function tag(index){const [tone,tint]=palette(index);return `<span class="tag" style="--tone:${tone};--tint:${tint}">${stages[index]}</span>`}
$('statusSummary').innerHTML=stages.map((s,i)=>`<div class="summary-item"><span>${s}</span><b>${records.filter(r=>r.stage===i).length}</b></div>`).join('');
function renderOptions(){$('statusOptions').innerHTML=['全部状态',...stages].map((s,i)=>`<button type="button" class="option ${pendingStatus===(i===0?'':String(i-1))?'chosen':''}" data-status="${i===0?'':i-1}">${s}</button>`).join('')}
function renderRows(){const slice=visible.slice((page-1)*size,page*size);$('rows').innerHTML=slice.length?slice.map(r=>`<tr data-id="${r.id}" class="${selected===r.id?'selected':''}"><td><input type="radio" name="trade" value="${r.id}" aria-label="选择${escapeText(r.name)}" ${selected===r.id?'checked':''}></td><td title="${r.id}">${r.id}</td><td title="${escapeText(r.name)}">${escapeText(r.name)}</td><td>${r.type}</td><td>${r.date} ${r.time}</td><td>${tag(r.stage)}</td><td><button class="link" data-view="${r.id}">查看时间线</button></td></tr>`).join(''):'<tr><td colspan="7" class="table-empty">暂无符合条件的交易，请调整筛选条件</td></tr>';const pages=Math.max(1,Math.ceil(visible.length/size));$('recordCount').textContent=`共 ${visible.length} 条记录`;$('pager').innerHTML=`<span class="page-size">每页 10 条</span><button class="page-btn" data-page="${page-1}" aria-label="上一页" ${page===1?'disabled':''}><svg><use href="#i-left"/></svg></button>${Array.from({length:pages},(_,i)=>`<button class="page-btn ${page===i+1?'current':''}" data-page="${i+1}" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-btn" data-page="${page+1}" aria-label="下一页" ${page===pages?'disabled':''}><svg><use href="#i-right"/></svg></button>`;}
function renderTimeline(){const r=records.find(r=>r.id===selected);$('tradeName').textContent=r?'· '+r.name:'';$('currentStatus').innerHTML=r?tag(r.stage):'';if(!r){$('timelineBody').innerHTML='<div class="empty"><svg><use href="#i-document"/></svg>请选择一条交易查看</div>';return}$('timelineBody').innerHTML=`<div class="timeline-body"><div class="metadata"><div><span>交易序列号</span>${r.id}</div><div><span>交易品种</span>${r.type}</div><div><span>执行时段</span>${r.date} ${r.time}</div><div><span>更新时间</span>${r.updatedAt}</div></div><div class="steps-wrap"><ol class="steps">${stages.map((s,i)=>`<li class="step ${i<r.stage?'done':i===r.stage?'current':''}" ${i===r.stage?'aria-current="step"':''}><span class="node">${i<r.stage?'✓':''}</span>${s}<small>${i===r.stage?'当前阶段':i<r.stage?'已完成':'未到达'}</small></li>`).join('')}</ol></div></div>`}
function selectTrade(id,scroll){selected=id;renderRows();renderTimeline();const radio=document.querySelector(`input[value="${id}"]`);if(radio)radio.focus({preventScroll:true});if(scroll)$('timelineCard').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('rows').addEventListener('click',e=>{const row=e.target.closest('tr[data-id]');if(row)selectTrade(row.dataset.id,!!e.target.closest('[data-view]'))});
$('rows').addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))selectTrade(e.target.value,false)});
$('pager').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;page=Number(b.dataset.page);renderRows();$('tableScroll').scrollTop=0});
function filter(){syncClearButtons();clearTimeout(keywordTimer);const query=$('keyword').value.trim().toLowerCase();visible=records.filter(r=>(r.id+' '+r.name).toLowerCase().includes(query)&&(pendingStatus===''||r.stage===Number(pendingStatus))&&(!pendingDate||r.date===pendingDate));if(!visible.some(r=>r.id===selected))selected=null;page=1;renderRows();renderTimeline();$('tableScroll').scrollTop=0;document.querySelectorAll('details').forEach(d=>d.open=false)}
let keywordTimer;
$('keyword').addEventListener('input',()=>{syncClearButtons();clearTimeout(keywordTimer);keywordTimer=setTimeout(filter,250)});
$('filtersForm').addEventListener('submit',e=>{e.preventDefault();clearTimeout(keywordTimer);filter()});$('filtersForm').addEventListener('reset',e=>{e.preventDefault();$('keyword').value='';pendingStatus='';pendingDate='';$('statusValue').textContent='全部状态';$('dateValue').textContent='请选择执行日期';renderOptions();renderCalendar();filter()});
$('statusOptions').addEventListener('click',e=>{const b=e.target.closest('[data-status]');if(!b)return;pendingStatus=b.dataset.status;$('statusValue').textContent=b.textContent;renderOptions();$('statusDropdown').open=false;filter()});

function renderCalendar(){$('monthLabel').textContent=`${year} 年 ${month+1} 月`;const first=(new Date(year,month,1).getDay()+6)%7;const days=new Date(year,month+1,0).getDate();$('calendarGrid').innerHTML=['一','二','三','四','五','六','日'].map(d=>`<span class="weekday">${d}</span>`).join('')+'<span></span>'.repeat(first)+Array.from({length:days},(_,i)=>{const date=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button type="button" class="day ${date===pendingDate?'selected':''}" data-date="${date}" aria-label="${date}">${i+1}</button>`}).join('')}
function changeMonth(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();renderCalendar()}
$('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);$('calendarGrid').onclick=e=>{const b=e.target.closest('[data-date]');if(!b)return;pendingDate=b.dataset.date;$('dateValue').textContent=pendingDate;$('dateDropdown').open=false;renderCalendar();filter()};$('clearDate').onclick=()=>{pendingDate='';$('dateValue').textContent='请选择执行日期';$('dateDropdown').open=false;renderCalendar();filter()};document.addEventListener('click',e=>document.querySelectorAll('details[open]').forEach(d=>{if(!d.contains(e.target))d.open=false}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details[open]').forEach(d=>d.open=false)});
function syncClearButtons(){
 [['clearKeyword',$('keyword').value!== ''],['clearStatus',pendingStatus!==''],['clearDateField',pendingDate!=='']].forEach(([id,hasValue])=>{const button=$(id);button.hidden=!hasValue;button.parentElement.classList.toggle('has-value',hasValue)});
}
$('clearKeyword').onclick=()=>{$('keyword').value='';filter();$('keyword').focus()};
$('clearStatus').onclick=()=>{pendingStatus='';$('statusValue').textContent='全部状态';renderOptions();filter();$('statusDropdown').querySelector('summary').focus()};
$('clearDateField').onclick=()=>{pendingDate='';$('dateValue').textContent='请选择执行日期';renderCalendar();filter();$('dateDropdown').querySelector('summary').focus()};
renderOptions();renderCalendar();renderRows();renderTimeline();syncClearButtons();
</script>
