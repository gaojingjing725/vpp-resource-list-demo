<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-nav-layout="top">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>筛选区示例 - 虚拟电厂智慧运营平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="shared-navigation.css?v=20260827-3"><link rel="stylesheet" href="shared-list-components.css?v=20260821-6"><link rel="stylesheet" href="shared-primary-menu-active.css">
<style>
:root{--page:#0A1929;--card:#0D2137;--card-alt:#0F2640;--text:#E8F0FC;--secondary:#A3B8D0;--muted:#6B8AAB;--disabled:#4A5A70;--primary:#1776E5;--primary-light:#4897F3;--border-default:rgba(255,255,255,.10);--border-divider:rgba(255,255,255,.08);--border-subtle:rgba(255,255,255,.06);--header-h:56px;--nav-sidebar-w:220px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
:root[data-theme="light"]{--page:#F3F7FC;--card:#FFF;--card-alt:#FFF;--text:#172B43;--secondary:#4F647A;--muted:#75879A;--disabled:#A8B4C0;--border-default:rgba(23,43,67,.16);--border-divider:rgba(23,43,67,.12);--border-subtle:rgba(23,43,67,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font:14px var(--font)}button,input{font:inherit}.main{position:fixed;inset:var(--header-h) 0 0;padding:0 24px 24px;overflow:auto}:root[data-nav-layout="side"] .main{left:var(--nav-sidebar-w)}.breadcrumb{height:40px;margin-bottom:16px;display:flex;align-items:center;border-bottom:1px solid var(--border-subtle)}.breadcrumb-list{display:flex;align-items:center;gap:8px;color:var(--secondary);font-size:12px}.breadcrumb-separator{color:var(--disabled)}.examples{display:flex;flex-direction:column;gap:16px}.example-label{margin:0 0 8px;color:var(--secondary);font-size:12px}.filter-section{margin-bottom:0}.header-nav-item.active{color:var(--text)}
</style><link rel="stylesheet" href="shared-theme.css">
</head>
<body>
<header class="header"><div class="header-left"><div class="header-logo"><div class="header-logo-icon"><img src="vpp-logo.svg" width="32" height="32" alt=""></div><span class="header-logo-title">虚拟电厂智慧运营平台</span></div><nav class="header-nav"><div class="header-nav-item" onclick="location.href='index.html'">首页</div><div class="header-nav-item">基础管理</div><div class="header-nav-item" onclick="location.href='resource-list.html'">资源池管理</div><div class="header-nav-item header-nav-dropdown" tabindex="0" aria-expanded="false">运行监测<div class="header-submenu"><div class="header-submenu-item">历史数据查询</div><div class="header-submenu-item" onclick="location.href='control-command.html'">控制指令下发</div></div></div><div class="header-nav-item" onclick="location.href='optimization-decomposition.html'">协调控制</div><div class="header-nav-item">物联采集</div><div class="header-nav-item" onclick="location.href='user-management.html'">系统管理</div><div class="header-nav-item">需求响应</div><div class="header-nav-item active">更多</div></nav></div><div class="header-right"><button class="nav-layout-toggle" id="navLayoutToggle" onclick="toggleNavLayout()" aria-label="切换菜单布局"><i class="fa-solid fa-table-columns"></i></button><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切换主题"><i class="fa-solid fa-sun"></i></button><div class="header-avatar-wrapper"><div class="header-avatar">GJ</div><i class="fa-solid fa-chevron-down header-avatar-arrow"></i></div></div></header>
<main class="main"><div class="breadcrumb"><div class="breadcrumb-list"><i class="fa-solid fa-house"></i><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span>更多</span><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span>筛选区示例</span></div></div><div class="examples" id="examples"></div></main>
<script>
function exampleMarkup(count){const fields=Array.from({length:count},(_,i)=>'<div class="field"><label>筛选条件 '+(i+1)+'</label><input class="control" placeholder="请输入筛选条件 '+(i+1)+'"></div>').join('');return '<section><p class="example-label">'+count+' 个筛选条件</p><div class="filter-section"><div class="filter-header"><span class="filter-title">筛选条件</span><button class="filter-toggle"><i class="fa-solid fa-chevron-up"></i> 收起</button></div><div class="filters">'+fields+'<div class="actions"><button class="btn btn-primary btn-md"><i class="fa-solid fa-magnifying-glass"></i>查询</button><button class="btn btn-ghost btn-md"><i class="fa-solid fa-rotate-left"></i>重置</button></div></div></div></section>'}examples.innerHTML=Array.from({length:8},(_,i)=>exampleMarkup(i+1)).join('');
function updateButtons(){const light=document.documentElement.dataset.theme==='light',side=document.documentElement.dataset.navLayout==='side';themeToggle.innerHTML='<i class="fa-solid fa-'+(light?'moon':'sun')+'"></i>';navLayoutToggle.innerHTML='<i class="fa-solid fa-'+(side?'window-maximize':'table-columns')+'"></i>'}function toggleTheme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='light'?'dark':'light';localStorage.setItem('vpp-theme',root.dataset.theme);updateButtons()}function toggleNavLayout(){const root=document.documentElement;root.dataset.navLayout=root.dataset.navLayout==='side'?'top':'side';localStorage.setItem('vpp-nav-layout',root.dataset.navLayout);updateButtons()}document.documentElement.dataset.theme=localStorage.getItem('vpp-theme')||'dark';document.documentElement.dataset.navLayout=localStorage.getItem('vpp-nav-layout')||'top';updateButtons();
</script>
</body></html>
