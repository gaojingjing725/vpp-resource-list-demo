function link(r,action,label){return `<button class="link ${action==='delete'?'danger':''}" data-action="${action}" data-id="${r.id}">${label}</button>`}

function render(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,pages);const list=all.slice((page-1)*size,page*size);$('results').className='cards';$('results').innerHTML=list.length?list.map(r=>`<article class="card"><h2 class="card-title">${icon('cube')}<span class="ellipsis" data-tip="${esc(r.name)}">${esc(r.name)}</span></h2><div class="card-body"><div class="attributes"><span class="label">产品分类</span><span class="value ellipsis" data-tip="${esc(r.category)}">${esc(r.category)}</span><span class="label">产品类型</span>${tag(r)}<span class="label">ProductKey</span><span class="value ellipsis" data-tip="${esc(r.key)}">${esc(r.key)}</span></div><div class="product-art" aria-hidden="true">${icon('cube')}</div></div><div class="card-footer">${links(r)}${link(r,'delete','删除')}</div></article>`).join(''):'<div class="empty">暂无符合条件的产品</div>'
$('total').textContent=`共 ${all.length} 条`;$('pageSizeLabel').textContent=`${size}条/页`;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.size===size));$('pager').innerHTML=`<button class="page" data-page="${page-1}" aria-label="上一页" ${page===1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="page ${page===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}<button class="page" data-page="${page+1}" aria-label="下一页" ${page===pages?'disabled':''}>›</button><label class="page-jump">前往 <input id="jumpPage" type="text" inputmode="numeric" aria-label="跳转页码" value="${page}"> 页</label>`}
$('cardView').onclick=()=>render();$('tableView').onclick=()=>{const tip=$('toast');tip.textContent='此预览仅展示卡片视图';tip.hidden=false;clearTimeout(window.viewNoticeTimer);window.viewNoticeTimer=setTimeout(()=>tip.hidden=true,2000)};$('pager').onclick=e=>{const b=e.target.closest('[data-page]');if(b&&!b.disabled){page=+b.dataset.page;render()}};
$('pageSizeSelect').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;size=+b.dataset.size;page=1;$('pageSizeSelect').open=false;render()});
function jumpToPage(input){const max=Math.max(1,Math.ceil(filtered().length/size));const value=input.value.trim();if(!/^\d+$/.test(value)){input.value=page;return}page=Math.max(1,Math.min(max,Number(value)));render()}
$('pager').addEventListener('keydown',e=>{if(e.target.id==='jumpPage'&&e.key==='Enter'){e.preventDefault();jumpToPage(e.target)}});
$('pager').addEventListener('change',e=>{if(e.target.id==='jumpPage')jumpToPage(e.target)});
document.addEventListener('click',e=>{if(!$('pageSizeSelect').contains(e.target))$('pageSizeSelect').open=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('pageSizeSelect').open=false});
function search(){query={name:$('nameFilter').value.trim().toLowerCase(),key:$('keyFilter').value.trim().toLowerCase()};page=1;render()}
$('filterForm').onsubmit=e=>{e.preventDefault();search()};$('filterForm').onreset=e=>{e.preventDefault();$('nameFilter').value='';$('keyFilter').value='';syncClears();search()};function syncClears(){document.querySelectorAll('[data-clear]').forEach(b=>b.hidden=!$(b.dataset.clear).value)}$('filterForm').oninput=syncClears;document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{$(b.dataset.clear).value='';syncClears();search()});$('collapse').onclick=()=>{const hide=!$('filterForm').hidden;$('filterForm').hidden=hide;$('collapse').textContent=hide?'展开 ⌄':'收起 ⌃';$('collapse').setAttribute('aria-expanded',!hide)};
window.toggleTheme=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';updateTheme()};function updateTheme(){$('themeToggle').innerHTML=`<i class="fa-solid fa-${document.documentElement.dataset.theme==='light'?'moon':'sun'}"></i>`}updateTheme();window.toggleNavLayout=()=>{document.documentElement.dataset.navLayout=document.documentElement.dataset.navLayout==='top'?'side':'top'};window.toggleAvatar=e=>{e.stopPropagation();$('avatarBtn').classList.toggle('open');$('avatarPanel').classList.toggle('show')};document.addEventListener('click',()=>{$('avatarBtn').classList.remove('open');$('avatarPanel').classList.remove('show')});
function openDialog(action,id){editing=records.find(r=>r.id===id);mode=action;const r=editing||{name:'',category:'',type:'直连设备',key:''};$('dialogTitle').textContent={edit:'编辑产品',add:'新增产品',detail:'产品详情',model:'物模型',delete:'删除产品'}[action];if(action==='edit'||action==='add'){$('dialogBody').innerHTML=[['name','产品名称'],['category','产品分类'],['key','ProductKey']].map(([k,l])=>`<div><label for="edit-${k}">${l}</label><input class="control" id="edit-${k}" name="${k}" value="${esc(r[k])}" required></div>`).join('')+`<div><label for="edit-type">产品类型</label><input class="control" id="edit-type" name="type" list="product-types" value="${r.type}" required><datalist id="product-types"><option value="直连设备"><option value="网关设备"><option value="网关子设备"></datalist></div>`}else if(action==='delete'){$('dialogBody').textContent=`确认删除“${r.name}”？此操作仅影响本次预览的示例数据。`}else if(action==='model'){$('dialogBody').innerHTML=`<p>${esc(r.name)}</p><p style="color:var(--text-muted)">暂无物模型示例数据</p>`}else{$('dialogBody').innerHTML=[['产品名称',r.name],['ID',r.id],['产品分类',r.category],['产品类型',r.type],['ProductKey',r.key],['创建时间',r.created]].map(([k,v])=>`<div class="detail-row"><span class="label">${k}</span><span>${esc(v)}</span></div>`).join('')}$('dialogFoot').innerHTML=`<button class="btn secondary" type="button" data-dismiss>${['detail','model'].includes(action)?'关闭':'取消'}</button>`+(['detail','model'].includes(action)?'':`<button class="btn primary" type="submit" ${action==='delete'?'style="background:var(--red-500)"':''}>${action==='delete'?'删除':'保存'}</button>`);$('dialog').showModal()}
$('results').onclick=e=>{const b=e.target.closest('[data-action]');if(b)openDialog(b.dataset.action,+b.dataset.id)};$('add').onclick=()=>openDialog('add');$('close').onclick=()=>$('dialog').close();$('dialogFoot').onclick=e=>{if(e.target.closest('[data-dismiss]'))$('dialog').close()};$('editor').onsubmit=e=>{e.preventDefault();if(mode==='delete')records=records.filter(r=>r.id!==editing.id);else{const d=Object.fromEntries(new FormData($('editor')));if(editing)Object.assign(editing,d);else records.unshift({...d,id:Math.max(0,...records.map(r=>r.id))+1,created:new Date().toLocaleString('sv-SE')})}$('dialog').close();render()};
$('export').onclick=()=>{const cell=s=>'"'+String(s).replace(/"/g,'""')+'"';const csv='\ufeff'+[['产品名称','ID','ProductKey','产品分类','产品类型','创建时间'],...filtered().map(r=>[r.name,r.id,r.key,r.category,r.type,r.created])].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='产品管理示例.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function showTip(e){const el=e.target.closest('[data-tip]');if(!el||el.scrollWidth<=el.clientWidth)return;const rect=el.getBoundingClientRect(),tip=$('tooltip');tip.textContent=el.dataset.tip;tip.hidden=false;tip.style.left=Math.max(8,Math.min(rect.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.min(rect.bottom+8,innerHeight-tip.offsetHeight-8)+'px'}function hideTip(){$('tooltip').hidden=true}document.addEventListener('mouseover',showTip);document.addEventListener('focusin',showTip);document.addEventListener('mouseout',hideTip);document.addEventListener('focusout',hideTip);document.addEventListener('scroll',hideTip,true);render();
</script></body></html>
