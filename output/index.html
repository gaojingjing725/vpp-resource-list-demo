<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源池管理 - 虚拟电厂智慧运营平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ==============================
   @font-face — 阿里妈妈数黑体（永久免费商用）
   ============================== */
@font-face {
  font-family: "Alimama ShuHeiTi";
  font-weight: 700;
  src: url("//at.alicdn.com/wf/webfont/kfq1sgJFWQ6g/cPCrTL8ewntCCMPMNgo40.woff2") format("woff2"),
       url("//at.alicdn.com/wf/webfont/kfq1sgJFWQ6g/fu9Q_dW8qzsGtfSSU60a3.woff") format("woff");
  font-display: swap;
}

/* ==============================
   CSS 变量 — 引用颜色/排版/间距/圆角规范
   ============================== */
:root {
  /* 页面背景 */
  --page-bg: #0A1929;
  --card-bg: #0D2137;
  --card-bg-alt: #0F2640;

  /* 固定列不透明背景（表格规范 §12.2） */
  --fixed-bg-default: #0D2137;
  --fixed-bg-hover: #0E2845;
  --fixed-bg-selected: #0F2C4E;
  --fixed-bg-header: #0F2640;

  /* 固定列阴影边界（表格规范 §12.4） */
  --fixed-shadow-right: 6px 0 12px -2px rgba(255,255,255,0.12);
  --fixed-shadow-left: -6px 0 12px -2px rgba(255,255,255,0.12);

  /* 边框 */
  --border-subtle: rgba(255,255,255,0.06);
  --border-divider: rgba(255,255,255,0.08);
  --border-default: rgba(255,255,255,0.10);
  --border-hover: rgba(255,255,255,0.15);
  --border-active: rgba(22,104,220,0.30);
  --border-secondary: rgba(22,104,220,0.45);
  --border-secondary-hover: rgba(22,104,220,0.55);
  --border-secondary-active: rgba(22,104,220,0.60);

  /* 文本 */
  --text-primary: #E8F0FC;
  --text-secondary: #A3B8D0;
  --text-muted: #6B8AAB;
  --text-disabled: #4A5A70;
  --text-label: #7A96B8;

  /* 主色 */
  --primary-300: #7FB3EF;
  --primary-400: #4897F3;
  --primary-500: #1776E5;
  --primary-600: #095AB8;

  /* 语义色 */
  --green-500: #00D68F;
  --orange-500: #FFB547;
  --red-500: #FF5757;
  --red-400: #FF7070;
  --red-700: #C03838;
  --violet-500: #7C5CFF;
  --cyan-500: #00D4FF;

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* 间距 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;

  /* 圆角 */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* 布局 */
  --header-h: 56px;
  --breadcrumb-h: 40px;
  --content-px: 24px;
  --content-py: 24px;

  /* Z-index */
  --z-content: 0;
  --z-fixed-cell: 1;
  --z-sticky: 1;
  --z-table-header: 2;
  --z-fixed-corner: 3;
  --z-sidebar: 100;
  --z-header: 200;
  --z-dropdown: 1000;
  --z-drawer: 1200;
  --z-modal: 1300;
  --z-modal-mask: 1299;
  --z-toast: 1400;
}

/* ==============================
   全局重置
   ============================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: var(--font-sans);
  font-size: 14px;
  background-color: var(--page-bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  height: 100vh;
  overflow: hidden;
}

/* 滚动条 */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.10);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.15);
}

/* ==============================
   顶栏 Header — 56px 固定导航
   ============================== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);
  background: var(--card-bg);
  border-bottom: 1px solid var(--border-divider);
  display: flex;
  align-items: stretch;
  padding: 0 var(--space-6);
  z-index: var(--z-header);
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--space-6);
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-right: var(--space-6);
  margin-right: var(--space-2);
  border-right: 1px solid var(--border-subtle);
}

.header-logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(145deg, #061D35 0%, #0B2B4F 35%, #114480 100%);
  border: 1px solid rgba(23, 118, 229, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  box-shadow:
    0 4px 12px rgba(3, 12, 27, 0.5),
    0 0 0 1px rgba(23, 118, 229, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.header-logo-icon svg {
  width: 22px;
  height: 22px;
}

.header-logo-title {
  font-family: 'Alimama ShuHeiTi', var(--font-sans);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 2px;
}

.header-nav {
  display: flex;
  align-items: stretch;
  gap: var(--space-1);
  height: 100%;
}

.header-nav-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 200ms ease;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  user-select: none;
  white-space: nowrap;
}

/* 底部霓虹指示条 */
.header-nav-item::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(90deg, 
    transparent 0%, 
    rgba(72,151,243,0.3) 15%, 
    #4897F3 35%, 
    #7FB3EF 50%, 
    #4897F3 65%, 
    rgba(72,151,243,0.3) 85%, 
    transparent 100%);
  transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  filter: blur(0.3px);
}

/* 顶部电路走线 */
.header-nav-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 22%;
  right: 22%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(72,151,243,0.35), transparent);
  transition: all 250ms ease;
  opacity: 0;
}

.header-nav-item:hover {
  color: var(--text-primary);
  background: rgba(72,151,243,0.06);
  box-shadow: inset 0 -1px 0 rgba(23,118,229,0.15);
}

.header-nav-item:hover::after {
  width: 50%;
  opacity: 0.6;
}

.header-nav-item:hover::before {
  opacity: 0.4;
}

.header-nav-item.active {
  margin-bottom: -3px;
  color: #E8F4FF;
  background: linear-gradient(180deg, 
    rgba(23,118,229,0.04) 0%, 
    rgba(23,118,229,0.10) 25%, 
    rgba(23,118,229,0.22) 60%,
    rgba(23,118,229,0.38) 100%);
  border-bottom-color: transparent;
  font-weight: 600;
  box-shadow: 
    0 4px 24px -10px rgba(23,118,229,0.45),
    inset 0 1px 0 rgba(72,151,243,0.18);
  text-shadow: 0 0 14px rgba(72,151,243,0.2);
}

.header-nav-item.active::before {
  opacity: 1;
  background: linear-gradient(90deg, transparent, rgba(72,151,243,0.5), transparent);
}

.header-nav-item.active::after {
  width: 80%;
  opacity: 1;
  height: 2px;
  filter: blur(0px);
  box-shadow: 
    0 0 6px rgba(23,118,229,0.6),
    0 0 18px rgba(23,118,229,0.35),
    0 0 36px rgba(23,118,229,0.15),
    0 1px 0 rgba(23,118,229,0.4);
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.header-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--primary-500), var(--violet-500));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #FFFFFF;
  cursor: pointer;
  transition: all 150ms ease;
}

.header-avatar:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 2px rgba(23,118,229,0.30);
}

.header-avatar-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
}

.header-avatar-arrow {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform 200ms ease;
}

.header-avatar-wrapper.open .header-avatar-arrow {
  transform: rotate(180deg);
}

.dropdown-divider {
  height: 1px;
  background: var(--border-divider);
  margin: 2px 8px;
}

/* ==============================
   面包屑 — 40px
   ============================== */
.breadcrumb {
  position: fixed;
  top: var(--header-h);
  left: 0;
  right: 0;
  height: var(--breadcrumb-h);
  background: var(--page-bg);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 var(--content-px);
  z-index: var(--z-content);
}

.breadcrumb-list {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 13px;
}

.breadcrumb-item {
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 150ms ease;
}

.breadcrumb-item:hover {
  color: var(--primary-400);
}

.breadcrumb-item.current {
  color: var(--text-secondary);
  cursor: default;
}

.breadcrumb-item.current:hover {
  color: var(--text-secondary);
}

.breadcrumb-separator {
  color: var(--text-disabled);
  font-size: 9px;
}

/* ==============================
   内容区
   ============================== */
.content {
  position: fixed;
  top: calc(var(--header-h) + var(--breadcrumb-h));
  left: 0;
  right: 0;
  bottom: 0;
  padding: var(--content-py) var(--content-px);
  overflow-y: auto;
}

/* ==============================
   筛选区 — 引用表格规范 §6
   ============================== */
.filter-section {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  padding: var(--space-6);
  margin-bottom: var(--space-6);
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.filter-item {
  display: flex;
  flex-direction: column;
}

.filter-label {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: 6px;
  white-space: nowrap;
}

/* 自定义下拉/输入框通用样式 — 引用表单规范 §2 */
.filter-control {
  position: relative;
  width: 100%;
}

.filter-input {
  width: 100%;
  height: 38px;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-4);
  font-size: 14px;
  font-weight: 400;
  font-family: var(--font-sans);
  color: var(--text-primary);
  outline: none;
  transition: all 150ms ease;
  cursor: pointer;
}

.filter-input::placeholder {
  color: var(--text-muted);
}

.filter-input:hover {
  border-color: var(--border-hover);
}

.filter-input:focus,
.filter-input.active {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px rgba(23,118,229,0.10);
  background: rgba(23,118,229,0.06);
}

/* 搜索输入框 */
.filter-search {
  position: relative;
  width: 100%;
}

.filter-search i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text-muted);
  pointer-events: none;
}

.filter-search input {
  width: 100%;
  height: 38px;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-4) 0 40px;
  font-size: 14px;
  font-weight: 400;
  font-family: var(--font-sans);
  color: var(--text-primary);
  outline: none;
  transition: all 150ms ease;
}

.filter-search input::placeholder {
  color: var(--text-muted);
  font-size: 13px;
}

.filter-search input:hover {
  border-color: var(--border-hover);
}

.filter-search input:focus {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px rgba(23,118,229,0.10);
}

/* 下拉箭头 */
.filter-input .dropdown-arrow {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-muted);
  pointer-events: none;
  transition: transform 200ms ease;
}

.filter-input.open .dropdown-arrow {
  transform: translateY(-50%) rotate(180deg);
}

.filter-input-text {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 100%;
}

.filter-input-value {
  font-size: 13px;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-input-value.placeholder {
  color: var(--text-muted);
}

.filter-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  margin-top: var(--space-4);
}

/* ==============================
   按钮 — 引用按钮规范
   ============================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  font-size: 14px;
  font-weight: 500;
  font-family: var(--font-sans);
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
  outline: none;
}

/* Primary 主按钮 */
.btn-primary {
  background: var(--primary-500);
  color: #FFFFFF;
  padding: 0 var(--space-4);
  height: 38px;
  border: 1px solid transparent;
}

.btn-primary:hover {
  background: var(--primary-400);
}

.btn-primary:active {
  background: var(--primary-600);
}

/* Secondary 次按钮 */
.btn-secondary {
  background: transparent;
  color: var(--text-primary);
  padding: 0 var(--space-4);
  height: 38px;
  border: 1px solid var(--border-secondary);
}

.btn-secondary:hover {
  background: rgba(22,104,220,0.08);
  border-color: var(--border-secondary-hover);
}

.btn-secondary:active {
  background: rgba(22,104,220,0.15);
  border-color: var(--border-secondary-active);
}

/* Ghost 幽灵按钮 */
.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  padding: 0 var(--space-4);
  height: 38px;
  border: 1px solid transparent;
}

.btn-ghost:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text-primary);
}

/* Danger Outline 危险边框按钮 */
.btn-danger-outline {
  background: transparent;
  color: var(--red-500);
  padding: 0 var(--space-4);
  height: 38px;
  border: 1px solid var(--red-500);
}

.btn-danger-outline:hover {
  background: rgba(255,87,87,0.08);
}

.btn-danger-outline:active {
  background: rgba(255,87,87,0.15);
}

/* Small 尺寸 */
.btn-sm {
  height: 30px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* ==============================
   操作按钮栏 — 引用表格规范 §2
   ============================== */
.action-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}

.action-divider {
  width: 1px;
  height: 20px;
  background: var(--border-divider);
  margin: 0 var(--space-2);
}

/* ==============================
   表格容器 — 引用表格规范
   ============================== */
.table-container {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

.table-scroll {
  overflow-x: auto;
  border-radius: var(--radius-lg);
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
}

thead th {
  background: var(--fixed-bg-header);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-divider);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: var(--z-table-header);
}

tbody td {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

tbody tr {
  transition: background 150ms ease;
}

tbody tr:hover {
  background: rgba(23,118,229,0.06);
}

tbody tr.selected {
  background: rgba(23,118,229,0.10);
}

tbody tr.selected:hover {
  background: rgba(23,118,229,0.10);
}

tbody tr:last-child td {
  border-bottom: none;
}

/* 数字列 — 右对齐 + 等宽字体 */
td.num {
  text-align: right;
  font-family: var(--font-mono);
}

/* 日期列 */
td.date {}

/* 文本列超长省略 */
.td-text-ellipsis {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ========== 固定列（表格规范 §12） ========== */

/* 固定列列宽 — 必须显式设定以保证 sticky offset 计算准确 */
th.col-fixed-checkbox, td.col-fixed-checkbox { width: 48px; min-width: 48px; }
th.col-fixed-name,     td.col-fixed-name     { width: 180px; min-width: 180px; }
th.col-fixed-ops,      td.col-fixed-ops      { width: 100px; min-width: 100px; }

/* 左固定列基础 */
th.col-fixed-left, td.col-fixed-left {
  position: sticky;
  left: 0;
  overflow: visible;
}
/* 第 2 列左固定偏移 = 第 1 列宽度 (48px) */
th.col-fixed-left.col-fixed-name, td.col-fixed-left.col-fixed-name {
  left: 48px;
}

/* 右固定列基础 */
th.col-fixed-right, td.col-fixed-right {
  position: sticky;
  right: 0;
  overflow: visible;
}

/* Z-Index 层级：角落 th (3) > 普通 th (2) > 固定 td (1) > 普通 td (0) */
thead th.col-fixed-left,
thead th.col-fixed-right {
  z-index: var(--z-fixed-corner);
}
tbody td.col-fixed-left,
tbody td.col-fixed-right {
  z-index: var(--z-fixed-cell);
}

/* 不透明背景 — td（表格规范 §12.2 + §12.6） */
tbody td.col-fixed-left,
tbody td.col-fixed-right {
  background: var(--fixed-bg-default);
}
tbody tr:hover td.col-fixed-left,
tbody tr:hover td.col-fixed-right {
  background: var(--fixed-bg-hover);
}
tbody tr.selected td.col-fixed-left,
tbody tr.selected td.col-fixed-right {
  background: var(--fixed-bg-selected);
}
tbody tr.selected:hover td.col-fixed-left,
tbody tr.selected:hover td.col-fixed-right {
  background: var(--fixed-bg-selected);
}

/* 不透明背景 — th */
thead th.col-fixed-left,
thead th.col-fixed-right {
  background: var(--fixed-bg-header);
}

/* 阴影边界 — 最后一列左固定列的右侧（表格规范 §12.4）
   使用 ::after 伪元素，避免 box-shadow 被相邻单元格背景覆盖 */
th.col-last-left-fixed::after,
td.col-last-left-fixed::after {
  content: '';
  position: absolute;
  top: 0;
  right: -8px;
  bottom: 0;
  width: 8px;
  background: linear-gradient(to right, rgba(255,255,255,0.12), transparent);
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 200ms ease;
}

/* 第一列右固定列的左侧 */
th.col-first-right-fixed::after,
td.col-first-right-fixed::after {
  content: '';
  position: absolute;
  top: 0;
  left: -8px;
  bottom: 0;
  width: 8px;
  background: linear-gradient(to left, rgba(255,255,255,0.12), transparent);
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 200ms ease;
}

/* 滚动时显示阴影 */
.table-scroll.is-scrolling th.col-last-left-fixed::after,
.table-scroll.is-scrolling td.col-last-left-fixed::after,
.table-scroll.is-scrolling th.col-first-right-fixed::after,
.table-scroll.is-scrolling td.col-first-right-fixed::after {
  opacity: 1;
}

/* 滚动到边缘时隐藏阴影（表格规范 §12.5） */
.table-scroll.no-left-shadow th.col-last-left-fixed::after,
.table-scroll.no-left-shadow td.col-last-left-fixed::after {
  display: none;
}
.table-scroll.no-right-shadow th.col-first-right-fixed::after,
.table-scroll.no-right-shadow td.col-first-right-fixed::after {
  display: none;
}

/* Checkbox — 引用表单规范 §4.1 */
.checkbox {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--border-hover);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 150ms ease;
  flex-shrink: 0;
}

.checkbox:hover {
  border-color: var(--primary-400);
}

.checkbox.checked {
  background: var(--primary-500);
  border-color: var(--primary-500);
}

.checkbox.checked::after {
  content: '';
  width: 5px;
  height: 9px;
  border: solid #FFFFFF;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  margin-bottom: 1px;
}

.checkbox.indeterminate {
  background: var(--primary-500);
  border-color: var(--primary-500);
}

.checkbox.indeterminate::after {
  content: '';
  width: 8px;
  height: 2px;
  background: #FFFFFF;
  border-radius: 1px;
}

/* 标签列 — 资源类型 */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}

.tag-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
}

.tag-charging { background: rgba(0,212,255,0.12); color: var(--cyan-500); }
.tag-charging .tag-dot { background: var(--cyan-500); }

.tag-storage { background: rgba(124,92,255,0.12); color: var(--violet-500); }
.tag-storage .tag-dot { background: var(--violet-500); }

.tag-solar { background: rgba(255,181,71,0.12); color: var(--orange-500); }
.tag-solar .tag-dot { background: var(--orange-500); }

.tag-load { background: rgba(0,214,143,0.12); color: var(--green-500); }
.tag-load .tag-dot { background: var(--green-500); }

/* 操作列 — 引用按钮规范 §1.7 Link */
.action-links {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 0;
}

.action-link {
  font-size: 14px;
  font-weight: 400;
  color: var(--primary-400);
  cursor: pointer;
  transition: color 150ms ease;
  background: transparent;
  border: none;
  padding: 0;
  white-space: nowrap;
}

.action-link:hover {
  color: var(--primary-300);
}

.action-link:active {
  color: var(--primary-500);
}

.action-separator {
  width: 1px;
  height: 12px;
  background: var(--border-divider);
  margin: 0 var(--space-3);
}

/* ==============================
   分页器 — 引用表格规范 §9
   ============================== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-4);
  padding: 12px 16px;
  border-top: 1px solid var(--border-divider);
}

.pagination-total {
  font-size: 13px;
  color: var(--text-muted);
}

.page-size-select {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 13px;
  color: var(--text-muted);
}

.page-size-trigger {
  height: 32px;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  padding: 0 28px 0 12px;
  font-size: 13px;
  color: var(--text-primary);
  cursor: pointer;
  position: relative;
  transition: all 150ms ease;
  display: flex;
  align-items: center;
  min-width: 80px;
}

.page-size-trigger:hover {
  border-color: var(--border-hover);
}

.page-size-trigger i {
  position: absolute;
  right: 10px;
  font-size: 9px;
  color: var(--text-muted);
}

.page-numbers {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.page-btn {
  min-width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 150ms ease;
  background: transparent;
  border: none;
  padding: 0 6px;
}

.page-btn:hover {
  color: var(--text-primary);
  background: rgba(23,118,229,0.08);
}

.page-btn.active {
  color: #FFFFFF;
  background: var(--primary-500);
}

.page-btn.disabled {
  color: var(--text-disabled);
  cursor: not-allowed;
}

.page-btn.disabled:hover {
  background: transparent;
  color: var(--text-disabled);
}

.page-ellipsis {
  color: var(--text-muted);
  font-size: 13px;
  padding: 0 var(--space-1);
}

.page-jump {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 13px;
  color: var(--text-muted);
}

.page-jump input {
  width: 48px;
  height: 32px;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 13px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  outline: none;
  transition: all 150ms ease;
}

.page-jump input:hover {
  border-color: var(--border-hover);
}

.page-jump input:focus {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px rgba(23,118,229,0.10);
}

/* ==============================
   下拉面板 — 引用表单规范 §3
   ============================== */
.dropdown-panel {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  background: var(--card-bg-alt);
  border: 1px solid rgba(22,104,220,0.20);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0,0,0,0.40);
  padding: var(--space-1);
  z-index: var(--z-dropdown);
  display: none;
  max-height: 300px;
  overflow-y: auto;
}

.dropdown-panel.show {
  display: block;
}

/* 头像下拉面板 — 右对齐，定位在 wrapper 之后覆盖 base 的 min-width: 100% */
.dropdown-panel--avatar {
  position: absolute;
  top: calc(100% + 8px);
  left: auto;
  right: 0;
  min-width: 120px;
  width: auto;
  max-height: none;
  overflow-y: visible;
  padding: var(--space-1);
  background: var(--card-bg-alt);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0,0,0,0.40);
  z-index: 300;
}

.dropdown-panel--avatar .dropdown-option {
  padding: 10px 14px;
  font-size: 14px;
  justify-content: center;
}

.dropdown-option {
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 150ms ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  white-space: nowrap;
}

.dropdown-option:hover {
  background: rgba(23,118,229,0.08);
  color: var(--text-primary);
}

.dropdown-option.selected {
  background: rgba(23,118,229,0.12);
  color: var(--primary-400);
  font-weight: 500;
}

.dropdown-option.selected i {
  font-size: 11px;
  color: var(--primary-400);
}

/* 级联选择面板 */
.cascader-panel {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--card-bg-alt);
  border: 1px solid rgba(22,104,220,0.20);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0,0,0,0.40);
  z-index: var(--z-dropdown);
  display: none;
  overflow: hidden;
}

.cascader-panel.show {
  display: flex;
}

.cascader-column {
  width: 160px;
  max-height: 260px;
  overflow-y: auto;
  border-right: 1px solid var(--border-subtle);
  padding: var(--space-1);
}

.cascader-column:last-child {
  border-right: none;
}

.cascader-option {
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 150ms ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  white-space: nowrap;
}

.cascader-option:hover {
  background: rgba(23,118,229,0.08);
  color: var(--text-primary);
}

.cascader-option.selected {
  background: rgba(23,118,229,0.12);
  color: var(--primary-400);
  font-weight: 500;
}

.cascader-option i {
  font-size: 9px;
  color: var(--text-muted);
}

.cascader-option.selected i {
  color: var(--primary-400);
}

/* 选中计数提示 */
.batch-info-bar {
  display: none;
  align-items: center;
  gap: var(--space-3);
  padding: 10px 16px;
  background: rgba(23,118,229,0.08);
  border: 1px solid rgba(23,118,229,0.15);
  border-radius: var(--radius-sm);
  margin-bottom: var(--space-2);
}

.batch-info-bar.show {
  display: flex;
}

.batch-count {
  font-size: 13px;
  font-weight: 500;
  color: var(--primary-300);
}

.batch-divider {
  width: 1px;
  height: 20px;
  background: rgba(23,118,229,0.20);
}

.batch-clear {
  font-size: 14px;
  color: var(--primary-400);
  cursor: pointer;
  background: transparent;
  border: none;
  transition: color 150ms ease;
}

.batch-clear:hover {
  color: var(--primary-300);
}

/* Toast 通知 */
.toast {
  position: fixed;
  top: 80px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 12px 16px;
  background: var(--card-bg);
  border: 1px solid var(--border-divider);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0,0,0,0.40);
  z-index: var(--z-toast);
  font-size: 14px;
  color: var(--text-primary);
  opacity: 0;
  transform: translateY(-8px);
  transition: all 250ms cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.success i { color: var(--green-500); }
.toast.error i { color: var(--red-500); }
.toast.info i { color: var(--primary-400); }

/* 遮罩层 — 引用弹窗规范 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.80);
  z-index: var(--z-modal-mask);
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

/* 弹窗 — 引用弹窗规范 */
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  width: 640px;
  max-height: 90%;
  background: var(--card-bg);
  border: 1px solid rgba(22,104,220,0.15);
  border-radius: var(--radius-xl);
  box-shadow: 0 24px 64px rgba(0,0,0,0.50);
  z-index: var(--z-modal);
  display: flex;
  flex-direction: column;
  opacity: 0;
  transition: all 250ms cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
}

.modal.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-divider);
  flex-shrink: 0;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 26px;
}

.modal-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 150ms ease;
  background: transparent;
  border: none;
  font-size: 14px;
}

.modal-close:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text-secondary);
}

.modal-body {
  padding: 24px;
  max-height: 480px;
  overflow-y: auto;
  flex-shrink: 0;
}

.modal-body-text {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  line-height: 22px;
}

.modal-body-text strong {
  font-weight: 500;
  color: var(--text-primary);
}

.modal-body-warning {
  margin-top: 12px;
  font-size: 14px;
  color: var(--red-500);
}

.modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: 16px 24px;
  border-top: 1px solid var(--border-divider);
  flex-shrink: 0;
}

/* 表单弹窗内容 */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.form-row.full {
  grid-template-columns: 1fr;
}

.form-field {
  display: flex;
  flex-direction: column;
}

.form-field-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: var(--space-2);
}

.form-field-label .required {
  color: var(--red-500);
  margin-left: 2px;
}

.form-field input,
.form-field textarea {
  width: 100%;
  height: 38px;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-4);
  font-size: 14px;
  font-weight: 400;
  font-family: var(--font-sans);
  color: var(--text-primary);
  outline: none;
  transition: all 150ms ease;
}

.form-field input::placeholder,
.form-field textarea::placeholder {
  color: var(--text-muted);
}

.form-field input:hover,
.form-field textarea:hover {
  border-color: var(--border-hover);
}

.form-field input:focus,
.form-field textarea:focus {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px rgba(23,118,229,0.10);
}

.form-field textarea {
  height: auto;
  min-height: 80px;
  padding: 10px 16px;
  resize: vertical;
  line-height: 22px;
}

.form-footer-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-right: auto;
}

/* 减少动效 */
@media (prefers-reduced-motion: reduce) {
  .modal, .overlay, .toast {
    animation: none !important;
    transition: opacity 150ms ease !important;
    transform: none !important;
  }
  .modal.show {
    transform: translate(-50%, -50%) !important;
  }
}
</style>
</head>

          <circle cx="16" cy="4" r="2.6" fill="rgba(127,179,239,0.92)"/>

<div class="breadcrumb">

<div class="content">

  <!-- 筛选区 -->
  <div class="filter-section">

      <div class="filter-item">

        <div class="filter-control">

              <i class="fa-solid fa-chevron-down dropdown-arrow"></i>

          </div>
          <div class="cascader-panel" id="typePanel"></div>

/* ==============================
   分页器渲染
   ============================== */
function renderPagination() {
  const total = tableData.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));

  document.getElementById('totalRecords').textContent = `共 ${total} 条记录`;

  const pageNumbers = document.getElementById('pageNumbers');
  let html = '';

  // 上一页
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">
    <i class="fa-solid fa-chevron-left" style="font-size:11px;"></i>
  </button>`;

  // 页码逻辑
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }
  } else {
    // 第一页
    html += `<button class="page-btn ${1 === currentPage ? 'active' : ''}" onclick="goToPage(1)">1</button>`;

    if (currentPage > 4) {
      html += `<span class="page-ellipsis">...</span>`;
    }

    const start = Math.max(2, currentPage - 2);
    const end = Math.min(totalPages - 1, currentPage + 2);

    for (let i = start; i <= end; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }

    if (currentPage < totalPages - 3) {
      html += `<span class="page-ellipsis">...</span>`;
    }

    // 最后一页
    html += `<button class="page-btn ${totalPages === currentPage ? 'active' : ''}" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }

  // 下一页
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">
    <i class="fa-solid fa-chevron-right" style="font-size:11px;"></i>
  </button>`;

  pageNumbers.innerHTML = html;

  // 跳转输入框
  document.getElementById('jumpInput').value = currentPage;
}

function goToPage(page) {
  const totalPages = Math.max(1, Math.ceil(tableData.length / pageSize));
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
}

function handleJump(event) {
  if (event.key === 'Enter') {
    const page = parseInt(event.target.value);
    if (!isNaN(page)) goToPage(page);
  }
}

/* ==============================
   选择/批量操作
   ============================== */
function toggleRow(id) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    selectedIds.add(id);
  }
  renderTable();
}

function toggleSelectAll() {
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = tableData.slice(start, end);
  const allSelected = pageData.every(row => selectedIds.has(row.id));

  if (allSelected) {
    pageData.forEach(row => selectedIds.delete(row.id));
  } else {
    pageData.forEach(row => selectedIds.add(row.id));
  }
  renderTable();
}

function updateHeaderCheckbox() {
  const headerCheckbox = document.getElementById('headerCheckbox');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = tableData.slice(start, end);

  if (pageData.length === 0) {
    headerCheckbox.className = 'checkbox';
    return;
  }

  const selectedCount = pageData.filter(row => selectedIds.has(row.id)).length;
  if (selectedCount === 0) {
    headerCheckbox.className = 'checkbox';
  } else if (selectedCount === pageData.length) {
    headerCheckbox.className = 'checkbox checked';
  } else {
    headerCheckbox.className = 'checkbox indeterminate';
  }
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  const count = document.getElementById('batchCount');
  if (selectedIds.size > 0) {
    bar.classList.add('show');
    count.textContent = `已选择 ${selectedIds.size} 项`;
  } else {
    bar.classList.remove('show');
  }
}

function clearSelection() {
  selectedIds.clear();
  renderTable();
}

    const trigger = document.getElementById('userTrigger');
    panel.innerHTML = userList.map(u => `
      <div class="dropdown-option" onclick="selectUser('${u}')">
        <span>${u}</span>
        <i class="fa-solid fa-check" style="display:none;"></i>
      </div>
    `).join('');
    panel.classList.toggle('show');
    trigger.classList.toggle('open');
  } else if (name === 'pageSize') {
    const panel = document.getElementById('pageSizePanel');
    const trigger = document.getElementById('pageSizeTrigger');
    panel.querySelectorAll('.dropdown-option').forEach(opt => {
      const isActive = opt.textContent === document.getElementById('pageSizeValue').textContent;
      opt.classList.toggle('selected', isActive);
      const check = opt.querySelector('i');
      if (check) check.style.display = isActive ? 'inline' : 'none';
      if (!check) {
        const i = document.createElement('i');
        i.className = 'fa-solid fa-check';
        i.style.display = isActive ? 'inline' : 'none';
        opt.appendChild(i);
      }
    });
    panel.classList.toggle('show');
  } else if (name === 'avatar') {
    const panel = document.getElementById('avatarPanel');
    const wrapper = document.getElementById('avatarBtn');
    panel.classList.toggle('show');
    wrapper.classList.toggle('open');
  }
}

function selectUser(value) {
  const trigger = document.getElementById('userTrigger');
  const valueEl = trigger.querySelector('.filter-input-value');
  valueEl.textContent = value;
  valueEl.classList.remove('placeholder');
  document.getElementById('userPanel').classList.remove('show');
  trigger.classList.remove('open');
}

function handleAvatarAction(action) {
  document.getElementById('avatarPanel').classList.remove('show');
  if (action === 'profile') {
    showToast('跳转至个人中心', 'info');
  } else if (action === 'logout') {
    showToast('已退出登录', 'info');
  }
}

function changePageSize(size) {
  pageSize = size;
  document.getElementById('pageSizeValue').textContent = size + '条';
  document.getElementById('pageSizePanel').classList.remove('show');
  currentPage = 1;
  renderTable();
}

/* ==============================
   级联选择
   ============================== */
let cascaderState = { region: [null, null, null], type: [null, null, null] };

function toggleCascader(name) {
  closeAllDropdowns();
  const panel = document.getElementById(name + 'Panel');
  const trigger = document.getElementById(name + 'Trigger');
  const data = name === 'region' ? regionData : resourceTypeData;

  renderCascaderColumn(name, data, 0, panel);
  panel.classList.toggle('show');
  trigger.classList.toggle('open');

  // 设置宽度
  const openColumns = panel.querySelectorAll('.cascader-column').length;
  panel.style.width = (openColumns * 160) + 'px';
}

function renderCascaderColumn(name, items, level, panel) {
  // 移除当前层级之后的列
  const columns = panel.querySelectorAll('.cascader-column');
  for (let i = level; i < columns.length; i++) {
    columns[i].remove();
  }

  const col = document.createElement('div');
  col.className = 'cascader-column';

  items.forEach((item, idx) => {
    const isSelected = cascaderState[name][level] === idx;
    const hasChildren = item.children && item.children.length > 0;

    const option = document.createElement('div');
    option.className = 'cascader-option' + (isSelected ? ' selected' : '');
    option.innerHTML = `
      <span>${item.label}</span>
      ${hasChildren ? '<i class="fa-solid fa-chevron-right"></i>' : ''}
    `;

    option.onclick = function(e) {
      e.stopPropagation();
      cascaderState[name][level] = idx;

      // 清除更深层级的选择
      for (let i = level + 1; i < cascaderState[name].length; i++) {
        cascaderState[name][i] = null;
      }

      // 重新渲染当前列
      renderCascaderColumn(name, items, level, panel);

      // 如果有子级，渲染子级列
      if (hasChildren) {
        renderCascaderColumn(name, item.children, level + 1, panel);
      } else {
        // 叶子节点 — 设置选中值
        setCascaderValue(name);
        closeAllDropdowns();
      }

      // 更新面板宽度
      const openColumns = panel.querySelectorAll('.cascader-column').length;
      panel.style.width = (openColumns * 160) + 'px';
    };

    col.appendChild(option);
  });

  panel.appendChild(col);
}

function setCascaderValue(name) {
  const state = cascaderState[name];
  const data = name === 'region' ? regionData : resourceTypeData;
  const trigger = document.getElementById(name + 'Trigger');
  const valueEl = trigger.querySelector('.filter-input-value');

  let path = [];
  let current = data;

  for (let i = 0; i < state.length; i++) {
    if (state[i] === null) break;
    const item = current[state[i]];
    if (!item) break;
    path.push(item.label);
    if (item.children) {
      current = item.children;
    }
  }

  if (path.length > 0) {
    valueEl.textContent = path.join(' / ');
    valueEl.classList.remove('placeholder');
  }
}

/* ==============================
   关闭所有下拉
   ============================== */
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-panel.show').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.cascader-panel.show').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.filter-input.open').forEach(t => t.classList.remove('open'));
  const avatarWrapper = document.getElementById('avatarBtn');
  if (avatarWrapper) avatarWrapper.classList.remove('open');
}

// 点击外部关闭
document.addEventListener('click', function(e) {
  if (!e.target.closest('.filter-control') && !e.target.closest('.page-size-select') && !e.target.closest('.header-avatar-wrapper')) {
    closeAllDropdowns();
  }
});

/* ==============================
   筛选操作
   ============================== */
function applyFilters() {
  showToast('查询完成', 'success');
  renderTable();
}

function resetFilters() {
  // 重置区域
  cascaderState = { region: [null, null, null], type: [null, null, null] };
  document.querySelectorAll('.filter-input-value').forEach(el => {
    el.textContent = el.getAttribute('data-default') || '';
    el.classList.add('placeholder');
  });
  // 重置文本
  const regionTrigger = document.getElementById('regionTrigger');
  const typeTrigger = document.getElementById('typeTrigger');
  const userTrigger = document.getElementById('userTrigger');
  regionTrigger.querySelector('.filter-input-value').textContent = '请选择省 / 市 / 区县';
  regionTrigger.querySelector('.filter-input-value').classList.add('placeholder');
  typeTrigger.querySelector('.filter-input-value').textContent = '请选择资源类别';
  typeTrigger.querySelector('.filter-input-value').classList.add('placeholder');
  userTrigger.querySelector('.filter-input-value').textContent = '请选择归属企业';
  userTrigger.querySelector('.filter-input-value').classList.add('placeholder');
  document.getElementById('searchInput').value = '';

  showToast('已重置筛选条件', 'info');
}

/* ==============================
   新增/编辑弹窗
   ============================== */
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增资源';
  document.querySelectorAll('#formModal input, #formModal textarea').forEach(el => el.value = '');
  showModal('formModal');
}

function openEditModal(id) {
  const row = tableData.find(r => r.id === id);
  if (!row) return;

  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑资源';
  document.getElementById('formName').value = row.name;
  document.getElementById('formAccount').value = row.account;
  document.getElementById('formOperator').value = row.operator;
  document.getElementById('formUser').value = row.user;
  document.getElementById('formType').value = row.type;
  document.getElementById('formVoltage').value = row.voltage;
  document.getElementById('formCapacity').value = row.capacity;
  document.getElementById('formAdjustable').value = row.adjustable;
  document.getElementById('formRegion').value = row.region;
  showModal('formModal');
}

function saveResource() {
  const name = document.getElementById('formName').value.trim();
  const account = document.getElementById('formAccount').value.trim();

  if (!name) {
    showToast('请输入资源名称', 'error');
    return;
  }
  if (!account) {
    showToast('请输入户号', 'error');
    return;
  }

  const now = new Date();
  const timeStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0');

  if (editingId) {
    const row = tableData.find(r => r.id === editingId);
    if (row) {
      row.name = name;
      row.account = account;
      row.operator = document.getElementById('formOperator').value.trim() || row.operator;
      row.user = document.getElementById('formUser').value.trim() || row.user;
      row.type = document.getElementById('formType').value.trim() || row.type;
      row.voltage = document.getElementById('formVoltage').value.trim() || row.voltage;
      row.capacity = parseInt(document.getElementById('formCapacity').value) || row.capacity;
      row.adjustable = parseInt(document.getElementById('formAdjustable').value) || row.adjustable;
      row.region = document.getElementById('formRegion').value.trim() || row.region;
      row.updateTime = timeStr;
    }
    showToast('资源已更新', 'success');
  } else {
    const newId = Math.max(...tableData.map(r => r.id), 0) + 1;
    tableData.unshift({
      id: newId,
      name: name,
      operator: document.getElementById('formOperator').value.trim() || '-',
      user: document.getElementById('formUser').value.trim() || '-',
      account: account,
      region: document.getElementById('formRegion').value.trim() || '-',
      type: document.getElementById('formType').value.trim() || '负荷',
      capacity: parseInt(document.getElementById('formCapacity').value) || 0,
      adjustable: parseInt(document.getElementById('formAdjustable').value) || 0,
      voltage: document.getElementById('formVoltage').value.trim() || '-',
      updateTime: timeStr
    });
    showToast('资源已新增', 'success');
  }

  closeModal();
  renderTable();
}

/* ==============================
   删除操作
   ============================== */
function openDeleteModal(id) {
  deletingId = id;
  const row = tableData.find(r => r.id === id);
  document.getElementById('deleteName').textContent = row ? row.name : '该资源';
  showModal('deleteModal');
}

function confirmDelete() {
  if (deletingId) {
    tableData = tableData.filter(r => r.id !== deletingId);
    selectedIds.delete(deletingId);
    deletingId = null;
    closeDeleteModal();
    renderTable();
    showToast('资源已删除', 'success');
  }
}

function confirmBatchDelete() {
  if (selectedIds.size === 0) return;
  const count = selectedIds.size;
  tableData = tableData.filter(r => !selectedIds.has(r.id));
  selectedIds.clear();
  renderTable();
  showToast(`已删除 ${count} 项资源`, 'success');
}

function batchDelete() {
  if (selectedIds.size === 0) {
    showToast('请先勾选要删除的资源', 'warning');
    return;
  }
  confirmBatchDelete();
}

/* ==============================
   导出
   ============================== */
function exportAll() {
  showToast(`正在导出 ${tableData.length} 条数据...`, 'info');
}

function exportSelected() {
  showToast(`正在导出 ${selectedIds.size} 条选中数据...`, 'info');
}

/* ==============================
   弹窗控制
   ============================== */
function showModal(id) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('formModal').classList.remove('show');
}

function closeDeleteModal() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('deleteModal').classList.remove('show');
  deletingId = null;
}

/* ==============================
   Toast 通知
   ============================== */
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const msg = document.getElementById('toastMessage');
  const icon = toast.querySelector('i');

  msg.textContent = message;
  toast.className = 'toast ' + type;

  const icons = {
    success: 'fa-solid fa-circle-check',
    error: 'fa-solid fa-circle-exclamation',
    info: 'fa-solid fa-circle-info'
  };
  icon.className = icons[type] || icons.success;

  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ==============================
   固定列滚动阴影切换（表格规范 §12.5）
   ============================== */
let scrollTimer = null;
function updateStickyShadows() {
  const scroll = document.querySelector('.table-scroll');
  if (!scroll) return;
  const threshold = 1;
  if (scroll.scrollLeft <= threshold) {
    scroll.classList.add('no-left-shadow');
  } else {
    scroll.classList.remove('no-left-shadow');
  }
  if (scroll.scrollLeft + scroll.clientWidth >= scroll.scrollWidth - threshold) {
    scroll.classList.add('no-right-shadow');
  } else {
    scroll.classList.remove('no-right-shadow');
  }
}

function handleTableScroll() {
  const scroll = document.querySelector('.table-scroll');
  if (!scroll) return;

  // 滚动时显示阴影
  scroll.classList.add('is-scrolling');
  clearTimeout(scrollTimer);
  // 停止滚动 150ms 后隐藏
  scrollTimer = setTimeout(() => {
    scroll.classList.remove('is-scrolling');
  }, 150);

  updateStickyShadows();
}

const tableScrollEl = document.querySelector('.table-scroll');
if (tableScrollEl) {
  tableScrollEl.addEventListener('scroll', handleTableScroll);
}

/* ==============================
   初始化
   ============================== */
renderTable();
updateStickyShadows();
</script>
