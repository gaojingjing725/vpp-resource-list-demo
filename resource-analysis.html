<!DOCTYPE html><html lang="zh-CN" data-theme="dark" data-nav-layout="top"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>资源分析 - 虚拟电厂智慧运营平台</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="shared-navigation.css?v=20260827-1"><link rel="stylesheet" href="shared-list-components.css?v=20260821-6"><link rel="stylesheet" href="shared-primary-menu-active.css"><link rel="stylesheet" href="shared-theme.css"><link rel="stylesheet" href="shared-page-shell.css"><link rel="stylesheet" href="shared-content-components.css"><link rel="stylesheet" href="resource-analysis-page.css"></head><body>
<div id="sharedHeader" data-active-primary="资源池管理" data-active-secondary="资源分析"></div><script src="shared-header.js"></script>
<main class="main"><div class="breadcrumb"><div class="breadcrumb-list"><span class="breadcrumb-item" onclick="location.href='index.html'"><i class="fa-solid fa-house" style="font-size:12px;"></i></span><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span class="breadcrumb-item">资源池管理</span><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span><span class="breadcrumb-item current">资源分析</span></div></div><div class="filter-section" id="filterCard"><div class="filter-header"><span class="filter-title">筛选条件</span><button class="filter-toggle" type="button" aria-expanded="true" onclick="toggleFilter()"><i class="fa-solid fa-chevron-up"></i> <span>收起</span></button></div><div class="filters"><div class="field"><label>选择资源</label><div class="select-wrap" id="resourceSelect"><div class="control select-control" role="combobox" tabindex="0" aria-expanded="false" aria-controls="resourceSelectPanel" onclick="toggleResource(event)" onkeydown="resourceKeydown(event)"><span id="resourceValue">裕鑫盛知春里超充站</span><i class="fa-solid fa-chevron-down"></i></div><div class="select-panel" id="resourceSelectPanel" role="listbox"><div class="select-option active" role="option" tabindex="-1" aria-selected="true" onclick="chooseResource(event,'裕鑫盛知春里超充站')">裕鑫盛知春里超充站</div><div class="select-option" role="option" tabindex="-1" aria-selected="false" onclick="chooseResource(event,'苏州工业园区储能电站')">苏州工业园区储能电站</div><div class="select-option" role="option" tabindex="-1" aria-selected="false" onclick="chooseResource(event,'杭州余杭屋顶光伏项目')">杭州余杭屋顶光伏项目</div></div></div></div><div class="actions"><button class="btn btn-primary btn-md" onclick="applyResource()"><i class="fa-solid fa-magnifying-glass"></i>查询</button><button class="btn btn-ghost btn-md" onclick="resetResource()"><i class="fa-solid fa-rotate-left"></i>重置</button></div></div></div>
<div class="analysis-content"><section class="card"><div class="module-header">基本信息</div><div class="info-strip"><div class="info-field"><div class="info-label">资源名称</div><div class="info-value" id="infoName">裕鑫盛知春里超充站</div></div><div class="info-field"><div class="info-label">资源类型</div><div class="info-value" id="infoType">V2G充电桩</div></div><div class="info-field"><div class="info-label">画像标签</div><div class="info-value"><span class="tag">高峰谷差率</span><span class="tag">高负荷率</span></div></div><div class="info-field"><div class="info-label">资源响应评价</div><div class="info-value">良好</div></div><div class="info-field"><div class="info-label">资源调控评价</div><div class="info-value">良好</div></div></div></section>
<section class="card"><div class="module-header">典型用能行为曲线</div><div class="module-body"><div class="chart-frame" id="usageChart"></div></div></section>
<div class="analysis-split"><section class="card"><div class="module-header">负荷预测</div><div class="module-body"><div class="chart-frame" id="forecastChart"></div></div></section>
<section class="card"><div class="module-header">潜力评估</div><div class="module-body"><div class="tabs" role="tablist"><button class="tab active" data-mode="up" onclick="switchPotential('up')">上调</button><button class="tab" data-mode="down" onclick="switchPotential('down')">下调</button></div><div class="chart-frame" id="potentialChart"></div></div></section></div></div></main>
<script src="shared-chart-interactions.js"></script>
<script>
const resources={"裕鑫盛知春里超充站":"V2G充电桩","苏州工业园区储能电站":"储能","杭州余杭屋顶光伏项目":"光伏"};let selectedResource="裕鑫盛知春里超充站",potentialMode="up";
function times(step=35){const out=[];for(let n=0;n<1440;n+=step)out.push(String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'));return out}function series(count,base,amp,phase=0){return Array.from({length:count},(_,i)=>Math.max(0,Math.round((base+Math.sin(i/3+phase)*amp+Math.cos(i/7)*amp*.35)/10)*10))}
function drawChart(id,lines,tick=50){const host=document.getElementById(id),labels=times(),pointGap=id==='usageChart'?40:56,safeX=Math.max(pointGap*.3,18),maxValue=Math.ceil(Math.max(...lines.flatMap(x=>x.data))/tick)*tick,width=Math.max(host.clientWidth-48,(labels.length-1)*pointGap+safeX*2),height=Math.max(host.clientHeight,248),top=44,bottom=32,plotH=height-top-bottom,steps=maxValue/tick,yLabels=Array.from({length:steps+1},(_,i)=>i*tick),x=i=>safeX+i*(width-safeX*2)/(labels.length-1),y=v=>top+plotH-v/maxValue*plotH,legend=id==='usageChart'?[['--cyan-500','有功功率']]:id==='forecastChart'?[['','预测日期：'+new Date().toLocaleDateString('zh-CN')],['--primary-400','预测负荷']]:[['--primary-400','日前'],['--cyan-500','实时']],seriesNames=id==='usageChart'?['有功功率']:id==='forecastChart'?['预测负荷']:['日前','实时'];host.innerHTML='<div class="chart-y"><span class="chart-unit">单位 kW</span>'+yLabels.map(v=>'<span class="y-label" style="bottom:'+(bottom+v/maxValue*plotH)+'px">'+v+'</span>').join('')+'</div><div class="chart-viewport"><div class="chart-tooltip"></div><div class="chart-legend chart-legend-overlay">'+legend.map(item=>'<span class="legend-item">'+(item[0]?'<i class="legend-line" style="background:var('+item[0]+')"></i>':'')+item[1]+'</span>').join('')+'</div><div class="chart-scroll"><div class="chart-scroll-track" style="width:'+width+'px;height:'+height+'px"><svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">'+yLabels.map(v=>'<line class="grid-line" x1="0" y1="'+y(v)+'" x2="'+width+'" y2="'+y(v)+'"/>').join('')+labels.map((t,i)=>'<text class="axis-label" x="'+x(i)+'" y="'+(height-8)+'" text-anchor="middle">'+t+'</text>').join('')+lines.map((line,seriesIndex)=>'<polyline class="curve" stroke="'+line.color+'" points="'+line.data.map((v,i)=>x(i)+','+y(v)).join(' ')+'"/>'+line.data.map((v,i)=>'<circle class="point" data-series="'+seriesIndex+'" data-index="'+i+'" fill="'+line.color+'" cx="'+x(i)+'" cy="'+y(v)+'" r="2.5"/>').join('')).join('')+'</svg></div></div></div>';bindSharedChartTooltip({host,labels,lines,seriesNames,x,top,bottom,height,plotHeight:plotH,width})}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}function renderCharts(){const count=times().length;drawChart('usageChart',[{data:series(count,260,95,.2),color:css('--cyan-500')}],50);drawChart('forecastChart',[{data:series(count,310,110,.8),color:css('--primary-400')}],50);const down=potentialMode==='down';drawChart('potentialChart',[{data:series(count,down?120:190,down?45:70,.4),color:css('--primary-400')},{data:series(count,down?105:175,down?40:62,.75),color:css('--cyan-500')}],50)}
function setResourceOpen(open){resourceSelect.classList.toggle('open',open);resourceSelect.querySelector('.select-control').setAttribute('aria-expanded',String(open))}function toggleResource(e){e.stopPropagation();setResourceOpen(!resourceSelect.classList.contains('open'))}function resourceKeydown(e){const options=[...resourceSelect.querySelectorAll('.select-option')];if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleResource(e);return}if(e.key==='Escape'){setResourceOpen(false);return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!resourceSelect.classList.contains('open'))setResourceOpen(true);const current=options.findIndex(x=>x.getAttribute('aria-selected')==='true'),next=(current+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[next].focus()}}function chooseResource(e,name){e.stopPropagation();selectedResource=name;resourceValue.textContent=name;resourceSelect.querySelectorAll('.select-option').forEach(x=>{const active=x.textContent===name;x.classList.toggle('active',active);x.setAttribute('aria-selected',String(active))});setResourceOpen(false);resourceSelect.querySelector('.select-control').focus()}resourceSelect.querySelectorAll('.select-option').forEach(option=>option.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseResource(e,option.textContent)}else if(e.key==='Escape'){setResourceOpen(false);resourceSelect.querySelector('.select-control').focus()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const options=[...resourceSelect.querySelectorAll('.select-option')],index=options.indexOf(option),next=(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[next].focus()}}));function applyResource(){infoName.textContent=selectedResource;infoType.textContent=resources[selectedResource];renderCharts()}function resetResource(){chooseResource({stopPropagation(){}},'裕鑫盛知春里超充站');applyResource()}function switchPotential(mode){potentialMode=mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));renderCharts()}
function toggleFilter(){const card=filterCard,collapsed=card.classList.toggle('is-collapsed'),button=card.querySelector('.filter-toggle');button.querySelector('span').textContent=collapsed?'展开':'收起';button.querySelector('i').className='fa-solid fa-chevron-'+(collapsed?'down':'up');button.setAttribute('aria-expanded',String(!collapsed))}function updateNavButtons(){const light=document.documentElement.dataset.theme==='light',side=document.documentElement.dataset.navLayout==='side';themeToggle.innerHTML='<i class="fa-solid fa-'+(light?'moon':'sun')+'"></i>';navLayoutToggle.innerHTML='<i class="fa-solid fa-'+(side?'window-maximize':'table-columns')+'"></i>'}function toggleTheme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='light'?'dark':'light';localStorage.setItem('vpp-theme',root.dataset.theme);updateNavButtons();renderCharts()}function toggleNavLayout(){const root=document.documentElement;root.dataset.navLayout=root.dataset.navLayout==='side'?'top':'side';localStorage.setItem('vpp-nav-layout',root.dataset.navLayout);updateNavButtons();setTimeout(renderCharts,220)}function toggleAvatar(e){e.stopPropagation();avatarBtn.classList.toggle('open');avatarPanel.classList.toggle('show')}document.addEventListener('click',()=>{setResourceOpen(false);avatarBtn.classList.remove('open');avatarPanel.classList.remove('show')});window.addEventListener('resize',()=>requestAnimationFrame(renderCharts));document.documentElement.dataset.theme=localStorage.getItem('vpp-theme')||'dark';document.documentElement.dataset.navLayout=localStorage.getItem('vpp-nav-layout')||'top';updateNavButtons();renderCharts();
</script></body></html>
